        + 'The board is showing Xero’s live figure, which can lag behind your bank feed. Enter your Revenue and Cost of goods once you have them and the board switches to your numbers.';
      var nudgeBtn = el('button', 'btn-plain', 'Enter figures now');
      nudgeBtn.style.marginTop = '8px';
      nudgeBtn.onclick = function () {
        var panel = document.getElementById('ov-panel');
        if (panel) { panel.open = true; panel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      };
      nudge.appendChild(document.createElement('br'));
      nudge.appendChild(nudgeBtn);
      root.appendChild(nudge);
    }
  }

  if (!isManual()) root.appendChild(overridePanel(r));

  if (isManual() && !manualEntry({ from: r.from, to: r.to })) {
    var mb = el('div', 'banner banner-amber');
    mb.innerHTML = '<b>No numbers entered for this period yet.</b> Add them and your dashboard fills in straight away.';
    mb.appendChild(document.createElement('br'));
    var mbtn = el('button', 'btn-plain', 'Enter numbers for ' + periodLabel().toLowerCase());
    mbtn.style.marginTop = '8px';
    mbtn.onclick = function () { state.enterPeriod = state.period; state.view = 'enter'; render(); };
    mb.appendChild(mbtn);
    root.appendChild(mb);
  }

  /* Cards. Per-shop views show only the metrics that split cleanly by shop;
     Wage %, Overheads and Profit are combined-only (shared costs). */
  var grid = el('div', 'cards');
  var cur = periodValues('cur'), prev = periodValues('prev'), yoy = periodValues('yoy');
  var shopMetrics = ['revenue', 'transactions', 'acs', 'cogs'];
  CHOSEN.filter(function (k) { return curLoc() === 'combined' || shopMetrics.indexOf(k) >= 0; })
    .forEach(function (k) { grid.appendChild(metricCard(k, cur, prev, yoy, r)); });
  root.appendChild(grid);
}

/* ---------- Manager view ----------
   A meeting-ready screen for one store (or the combined total) built around
   the SAME Period control as the main dashboard, plus its own "Talking to"
   store picker. A one-line takeaway and a "last time" callback sit above the
   numbers so nothing important gets missed reading digits cold. */
var MGR_SPARK_METRICS = ['revenue', 'transactions', 'acs']; /* magnitude metrics: no target, shown as trend */
var MGR_TARGET_METRICS = ['cogs', 'wage', 'overheads', 'profit']; /* %-of-revenue metrics: shown as a target meter */

function managerLabel(loc) { return loc === 'combined' ? 'Combined' : (loc === 'windsor' ? 'Windsor' : 'Richmond'); }

/* Pick the single best positive move and the single worst off-target metric,
   and turn them into one plain-English sentence. Only states what can be
   honestly computed from this period vs the last - no invented superlatives
   like "best week in a month" unless the trend data actually supports it. */
function managerTakeaway(loc, cur, prev) {
  var best = null; /* { key, cmp } */
  MGR_SPARK_METRICS.forEach(function (k) {
    var cv = metricValue(k, cur), pv = metricValue(k, prev);
    var cmp = compare(k, cv, pv);
    if (cmp && cmp.good && (!best || parseFloat(cmp.text) > parseFloat(best.cmp.text))) best = { key: k, cmp: cmp };
  });
  var worst = null; /* { key, zone, pf, t } */
  MGR_TARGET_METRICS.forEach(function (k) {
    if (loc !== 'combined' && ['wage', 'overheads', 'profit'].indexOf(k) >= 0) return; /* combined-only */
    var pf = primaryFigure(k, cur);
    var zone = targetZone(k, pf);
    if (!zone || zone === 'good') return;
    var t = metricTarget(k);
    var rank = zone === 'bad' ? 2 : 1;
    var curRank = worst ? (worst.zone === 'bad' ? 2 : 1) : 0;
    if (rank > curRank || (worst && rank === curRank && Math.abs(pf - t) > Math.abs(worst.pf - worst.t))) {
      worst = { key: k, zone: zone, pf: pf, t: t };
    }
  });

  var wrap = el('div', 'takeaway');
  wrap.appendChild(el('div', 'mark', worst && !best ? '!' : '▲'));
  var p = el('p');
  var bits = [];
  if (best) {
    bits.push('<b>' + esc(managerLabel(loc)) + (loc === 'combined' ? '' : '’s') + ' up ' + esc(best.cmp.text) + ' on ' + esc(METRIC_DEFS[best.key].label) + '</b>');
  }
  if (worst) {
    var over = METRIC_DEFS[worst.key].goodDir === 'down';
    var verb = worst.zone === 'bad' ? (over ? 'is over target' : 'is under target') : (over ? 'is close to target' : 'is close to target');
    bits.push((best ? 'But ' : '') + '<b>' + esc(METRIC_DEFS[worst.key].label) + ' ' + verb + '</b> at ' + esc(fmtPctVal(worst.pf)) + ' (target ' + esc(fmtTarget(worst.key, worst.t)) + ')' + (worst.zone === 'bad' ? ' — worth raising today.' : ' — worth keeping an eye on.'));
  }
  if (!best && !worst) bits.push('<b>Nothing off target this period</b> and no single number jumped out — a steady one.');
  p.innerHTML = bits.join(' ');
  wrap.appendChild(p);
  return wrap;
}

/* "Last time": did each %-of-revenue metric's target status change since the
   prior period? Surfaces what got fixed and what is still open, so a manager
   meeting can pick up where the last one left off instead of re-covering it. */
function managerCallback(loc, cur, prev) {
  var lines = [];
  MGR_TARGET_METRICS.forEach(function (k) {
    if (loc !== 'combined' && ['wage', 'overheads', 'profit'].indexOf(k) >= 0) return;
    var curZone = targetZone(k, primaryFigure(k, cur));
    var prevZone = targetZone(k, primaryFigure(k, prev));
    if (!curZone || !prevZone) return;
    var wasOff = prevZone !== 'good', isOff = curZone !== 'good';
    if (wasOff && !isOff) lines.push({ cls: 'ok', text: METRIC_DEFS[k].label + ' is back on target since last time.' });
    else if (wasOff && isOff) lines.push({ cls: 'open', text: METRIC_DEFS[k].label + ' is still off target — raised last time too.' });
  });
  if (!lines.length) return null;
  var wrap = el('div', 'callback');
  lines.forEach(function (l) { wrap.appendChild(el('div', l.cls, (l.cls === 'ok' ? '✓ ' : '● ') + esc(l.text))); });
  return wrap;
}

function managerSparkRow(key, loc, r) {
  /* Match the mini-trend's granularity to whatever period is selected: Week
     shows the last few weeks, everything else (Month/Quarter/FY) shows months -
     the one thing Kane specifically asked to have line up. */
  var weekly = periodParts(state.period).type === 'week';
  var granularity = weekly ? 'weekly' : 'monthly';
  var series = trendSeries(key, loc, granularity);
  var row = el('div', 'mgr-row');
  row.appendChild(el('div', 'mgr-lab', esc(METRIC_DEFS[key].label)));
  var viz = el('div', 'mgr-viz');
  var tgt = metricTarget(key);
  if (series && series.values.some(function (x) { return x != null; })) {
    var vals = series.values.slice(-8);
    var labs = series.months.slice(-8);
    /* Widen the scale to always include the target, same as the main Dashboard's
       trend chart, so a target line is never off the top of the bars just
       because trade has consistently cleared (or missed) it. */
    var max = Math.max.apply(null, vals.filter(function (x) { return x != null; }).concat([0], tgt != null ? [tgt] : []));
    var spark = el('div', 'mgr-spark');
    vals.forEach(function (v, i) {
      var bar = document.createElement('div');
      var h = (v == null || !(max > 0)) ? 2 : Math.max(2, Math.round((v / max) * 100));
      bar.style.height = h + '%';
      if (i === vals.length - 1) bar.className = 'cur';
      var lab = weekly ? ('wk of ' + fmtShortDate(fromIso(labs[i]))) : labs[i];
      bar.setAttribute('data-lab', lab + ' · ' + (v == null ? 'no data' : trendLabel(key, v)));
      spark.appendChild(bar);
    });
    if (tgt != null && max > 0) {
      var tline = document.createElement('div');
      tline.className = 'mgr-target-line';
      tline.style.bottom = Math.max(0, Math.min(100, (tgt / max) * 100)).toFixed(1) + '%';
      spark.appendChild(tline);
    }
    attachBarTip(spark);
    viz.appendChild(spark);
  } else {
    viz.appendChild(el('span', 'flat', 'Not enough history yet'));
  }
  row.appendChild(viz);
  return row;
}

function managerValCell(key, cur, prev) {
  var cell = el('div', 'mgr-val');
  var v = metricValue(key, cur);
  cell.appendChild(el('span', 'mgr-cell-val', fmtValue(key, v)));
  var cmp = compare(key, v, metricValue(key, prev));
  var deltaCls = !cmp ? 'flat' : (cmp.good == null ? 'flat' : (cmp.good ? 'good' : 'bad'));
  var deltaTxt = !cmp ? 'no data yet' : ((cmp.dir === 'up' ? '▲ ' : cmp.dir === 'down' ? '▼ ' : '● ') + cmp.text);
  cell.appendChild(el('span', 'mgr-cell-delta ' + deltaCls, esc(deltaTxt)));
  return cell;
}

function managerMeterRow(key, cur) {
  var pf = primaryFigure(key, cur);
  var t = metricTarget(key);
  var row = el('div', 'mgr-row');
  var over = METRIC_DEFS[key].goodDir === 'down';
  var tgtTxt = t == null ? '' : (over ? 'target ≤' : 'target ≥') + fmtTarget(key, t);
  if (key === 'profit' && profitExcludesOverheads(cur)) tgtTxt += (tgtTxt ? ' · ' : '') + 'excludes overheads (not in yet)';
  row.appendChild(el('div', 'mgr-lab', esc(METRIC_DEFS[key].label) + (tgtTxt ? '<span class="tgt">' + esc(tgtTxt) + '</span>' : '')));
  var viz = el('div', 'mgr-viz');
  var meter = targetMeter(key, pf);
  if (meter) viz.appendChild(meter); else viz.appendChild(el('span', 'flat', 'No target set'));
  row.appendChild(viz);
  var cell = el('div', 'mgr-val');
  var zone = targetZone(key, pf);
  var valLine = el('span', null);
  if (zone) valLine.appendChild(el('span', 'status-dot ' + zone));
  var valSpan = el('span', 'mgr-cell-val', esc(fmtPctVal(pf)));
  valSpan.style.display = 'inline';
  valLine.appendChild(valSpan);
  cell.appendChild(valLine);
  var status = !zone ? '' : (zone === 'good' ? 'on target' : zone === 'warn' ? 'close to target' : (over ? 'over target' : 'below target'));
  if (status) cell.appendChild(el('span', 'mgr-cell-delta ' + zone, status));
  row.appendChild(cell);
  return row;
}

function renderManager(root) {
  var r = resolvePeriod(state.period, state.customFrom, state.customTo);
  var pp = periodParts(state.period);

  /* Same Period control as the main dashboard - deliberately not a separate,
     simplified control, so switching between the two views never disorients. */
  var controlBar = el('div', 'control-bar');
  var left = el('div', 'control-left');
  left.appendChild(el('span', 'period-label', 'Period'));
  PERIOD_TYPES.filter(function (pt) { return pt.type !== 'custom'; }).forEach(function (pt) {
    var c = el('button', 'pchip' + (pp.type === pt.type ? ' on' : ''), pt.label);
    c.onclick = function () { state.period = periodKey(pt.type, 0); fetchData(); };
    left.appendChild(c);
  });
  var nav = el('div', 'period-nav');
  nav.style.margin = '0';
  var prevBtn = el('button', 'nav-arrow', '‹');
  prevBtn.title = 'Previous ' + pp.type;
  prevBtn.onclick = function () { state.period = periodKey(pp.type, pp.offset - 1); fetchData(); };
  nav.appendChild(prevBtn);
  if (pp.offset !== 0) {
    var todayBtn = el('button', 'nav-today', 'Jump to current');
    todayBtn.onclick = function () { state.period = periodKey(pp.type, 0); fetchData(); };
    nav.appendChild(todayBtn);
  } else {
    nav.appendChild(el('span', 'nav-current', 'Current ' + pp.type));

/* A spark row that also carries the value/delta cell (sparkline rows need

/* Hybrid entry: type Revenue / Cost of goods for this period; they overlay the

function overridePanel(r) {
  var key = rangeKey(r.from, r.to);
  var ov = OVERRIDES[key] || {};
  var ub = UBER[key] || {};
  var has = !!OVERRIDES[key] || !!UBER[key];
  var det = document.createElement('details');
  det.id = 'ov-panel';
  det.style.cssText = 'background:var(--cream2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:13px';
  var sum = document.createElement('summary');
  sum.style.cssText = 'cursor:pointer;font-weight:500;color:var(--black)';
  sum.textContent = (has ? '✎ Your figures for ' : '✎ Enter your own Revenue / Cost of goods / Uber Eats orders for ') + periodLabel().toLowerCase() + (has ? ' — edit' : ' (optional)');
  det.appendChild(sum);

  var hint = el('div', null, 'Type each shop’s Revenue and Cost of goods for this period — the board uses your figures (marked “Entered by you”) and the Combined view adds them up. Transactions stay live from Square; add Uber Eats orders below and they’re added on top of the Square count, not instead of it. Leave any box blank to keep using the live figure.');
  hint.style.cssText = 'color:var(--muted);margin:8px 0 10px;line-height:1.6';

  function field(labelText, val, placeholder, integer) {

    inp.style.cssText = 'font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;width:150px;background:var(--white);color:var(--text);box-sizing:border-box';
    wrap.appendChild(inp);
    return inp;
  }
  function shopFields(title, savedOv, savedUberCount) {
    var box = el('div'); box.style.cssText = 'margin:0 26px 6px 0';
    var h2 = el('div', null, title); h2.style.cssText = 'font-weight:600;color:var(--black);margin-bottom:6px'; box.appendChild(h2);
    var row = el('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;align-items:flex-end';
    var rev = field('Revenue (ex-GST)', savedOv.revenue, '$', false);
    var cog = field('Cost of goods', savedOv.cogs, '$', false);

    row.appendChild(rev.parentNode); row.appendChild(cog.parentNode); row.appendChild(ubi.parentNode);

  }
  var win = shopFields('Windsor', ov.windsor || {}, ub.windsor);
  var rich = shopFields('Richmond', ov.richmond || {}, ub.richmond);
  var wrap = el('div'); wrap.style.cssText = 'display:flex;flex-wrap:wrap';
  wrap.appendChild(win.box); wrap.appendChild(rich.box);
  det.appendChild(wrap);

  /* Fat-finger check: compare a typed figure against the same shop's figure
     from the equivalent period immediately before (only when one was entered
     there too - trading doesn't usually swing more than 3x week to week, so
     a bigger jump is more often a stray zero than a real result). */
  function priorKey() {
    var pp2 = periodParts(state.period);
    if (pp2.type === 'custom') {
      var len = Math.round((r.to - r.from) / 86400000) + 1;
      return rangeKey(addDays(r.from, -len), addDays(r.from, -1));
    }
    /* "One period back" of the same type - e.g. viewing this week (in
       progress, so it's shorter than 7 days) still compares against the
       full LAST week, not an equally-short sliver right before it. */
    var pr = resolvePeriod(periodKey(pp2.type, pp2.offset - 1));
    return rangeKey(pr.from, pr.to);
  }
  function outlierNote(loc, field, val) {
    var priorShop = (OVERRIDES[priorKey()] || {})[loc];
    var prior = (priorShop && typeof priorShop[field] === 'number') ? priorShop[field] : null;
    if (prior == null || prior === 0 || val === 0) return null;
    var ratio = val / prior;
    if (ratio >= 0.3 && ratio <= 3) return null;
    var shopLabel = loc === 'windsor' ? 'Windsor' : 'Richmond';
    var fieldLabel = field === 'revenue' ? 'Revenue' : 'Cost of goods';
    return fieldLabel + ' for ' + shopLabel + ': ' + fmtMoney(val) + ' vs ' + fmtMoney(prior) + ' last time (' + (ratio > 1 ? Math.round(ratio * 10) / 10 + '×' : Math.round(ratio * 100) + '%') + ')';
  }

  var actions = el('div'); actions.style.cssText = 'margin-top:4px;display:flex;gap:10px;align-items:center';

    var o = {}, u = {};
    function shopOv(f) { var s = {}; var rv = parseMoneyInput(f.rev.value); if (rv != null) s.revenue = rv; var cv = parseMoneyInput(f.cog.value); if (cv != null) s.cogs = cv; return Object.keys(s).length ? s : null; }
    function shopUber(f) { var n = parseInt(String(f.uber.value).replace(/[^0-9]/g, ''), 10); return (isFinite(n) && n >= 0 && String(f.uber.value).trim() !== '') ? n : null; }
    var w = shopOv(win); if (w) o.windsor = w;
    var rr = shopOv(rich); if (rr) o.richmond = rr;
    var wu = shopUber(win); if (wu != null) u.windsor = wu;
    var ru = shopUber(rich); if (ru != null) u.richmond = ru;

    var notes = [];
    ['windsor', 'richmond'].forEach(function (loc) {
      var s = (loc === 'windsor') ? w : rr;

      ['revenue', 'cogs'].forEach(function (field) {

      if (!ok) return;
    }

    if (Object.keys(o).length) OVERRIDES[key] = o; else delete OVERRIDES[key];
    if (Object.keys(u).length) UBER[key] = u; else delete UBER[key];
    saveOverrides(); saveUber(); render();
  };
  actions.appendChild(save);
  if (has) {
    var clr = el('button', 'btn-plain', 'Clear (use live figures)');
    clr.onclick = function () { delete OVERRIDES[key]; delete UBER[key]; saveOverrides(); saveUber(); render(); };
    actions.appendChild(clr);
  }

  return det;
}

    card.appendChild(el('div', 'notconf-msg', esc(missing) + ' isn’t connected yet. This card lights up when it is – nothing here shows a made-up zero.'));

  }

  if (state.data && state.data.manual) {

function sourceName(key) {

/* The date range a trend bucket covers, so it can be matched against an
   entered override's own range key. Monthly buckets are keyed 'YYYY-MM'
   (calendar month); weekly buckets are keyed by their week-start date. */
function trendBucketRange(bucketKey, weekly) {
  if (weekly) return { from: bucketKey, to: iso(addDays(fromIso(bucketKey), 6)) };
  var from = fromIso(bucketKey + '-01');
  return { from: bucketKey + '-01', to: iso(addDays(addMonths(from, 1), -1)) };
}

/* Trend per metric, in the card's PRIMARY unit: % of revenue for dual metrics,
   the value otherwise. One value per month (or week), null where data is
   missing. Any period you've entered your own Revenue/Cost of goods/Uber Eats
   figures for overlays the live pull here too, using the exact same combined/
   per-shop precedence as the cards (periodValues) - so a corrected week shows
   corrected everywhere, trend included, not just on the card itself. */
function trendSeries(key, locOverride, granularity) {  /* locOverride lets a caller (Manager view) read a specific
     shop's trend without touching SETTINGS.location / the main dashboard's shop switch. granularity: 'monthly'
     (default, last ~12 months) or 'weekly' (last MGR_WEEKLY_TREND_COUNT weeks, from the server's trendW block) -
     Manager view asks for 'weekly' when the selected period is Week, so the mini-trend actually matches. */
  var d = state.data;
  var weekly = granularity === 'weekly';
  if (weekly) {
    if (!d || !d.trendW || !d.trendW.weekStarts) return null;
  } else {
    if (!d || !d.trend || !d.trend.months) return null;
  }
  var buckets = weekly ? d.trendW.weekStarts : d.trend.months;
  var acc = (weekly ? d.trendW.accounting : d.trend.accounting) || {};
  var pos = (weekly ? d.trendW.pos : d.trend.pos) || {};
  var loc = locOverride || curLoc();
  function at(arr, i) { return (arr && arr[i] != null) ? arr[i] : null; }

  /* Combined + both per-shop live arrays are needed regardless of the
     requested loc, since a combined figure with only one shop's entry given
     still needs the OTHER shop's live number plus any untagged remainder -
     exactly what periodValues()'s combined()/untagged() do for a single slot. */
  function ovNum(ov, shop, field) { var o = ov && ov[shop]; return (o && typeof o[field] === 'number' && isFinite(o[field])) ? o[field] : null; }
  function shopEff(ov, shop, field, live) { var o = ovNum(ov, shop, field); return o != null ? o : live; }
  function combinedEff(ov, field, combinedLive, wLive, rLive) {
    if (ov && typeof ov[field] === 'number' && isFinite(ov[field])) return ov[field]; /* legacy single combined entry */
    var wOv = ovNum(ov, 'windsor', field), rOv = ovNum(ov, 'richmond', field);
    if (wOv == null && rOv == null) return combinedLive;
    var untagged = (wLive != null && rLive != null) ? (combinedLive - wLive - rLive) : 0;
    return (shopEff(ov, 'windsor', field, wLive) || 0) + (shopEff(ov, 'richmond', field, rLive) || 0) + (untagged || 0);
  }
  function effField(field, arrBase, i, ov) {
    var combinedLive = at(arrBase[''], i), wLive = at(arrBase['windsor'], i), rLive = at(arrBase['richmond'], i);

    var combinedLive = at(pos['count'], i), wLive = at(pos['count_windsor'], i), rLive = at(pos['count_richmond'], i);
    var live = loc === 'combined' ? combinedLive : (loc === 'windsor' ? wLive : rLive);
    var uberNum = function (shop) { var v = ub && ub[shop]; return (typeof v === 'number' && isFinite(v)) ? v : 0; };
    var extra = loc === 'combined' ? (uberNum('windsor') + uberNum('richmond')) : uberNum(loc);
    if (live == null) return extra > 0 ? extra : null;
    return live + extra;
  }
  var revArr = { '': acc['revenue'], windsor: acc['revenue_windsor'], richmond: acc['revenue_richmond'] };
  var cogArr = { '': acc['cogs'], windsor: acc['cogs_windsor'], richmond: acc['cogs_richmond'] };

  function val(i) {

}
/* Card headline: dual %/$ for share metrics, single value otherwise. */
function headline(key, vals, v) {

/* Target meter: fill to the value, a marker at the target, coloured by a
   3-zone read (good/warn/bad) from targetZone() - so "close to target" and
   "way past it" never share a color. Null when no target is set. */
function targetMeter(key, pf) {
  var t = metricTarget(key);
  if (t == null || pf == null || pf === 'dash') return null;
  var def = METRIC_DEFS[key];
  var zone = targetZone(key, pf); /* 'good' | 'warn' | 'bad' */
  var scale = Math.max(pf, t) * 1.4; if (!(scale > 0)) scale = 1;
  var wrap = el('div', 'meter');
  var track = el('div', 'meter-track');
  var fl = el('div', 'meter-fill ' + zone);
  fl.style.width = Math.max(0, Math.min(100, (pf / scale) * 100)).toFixed(1) + '%';
  var mk = el('div', 'meter-mark');
  mk.style.left = Math.max(0, Math.min(100, (t / scale) * 100)).toFixed(1) + '%';
  track.appendChild(fl); track.appendChild(mk);
  wrap.appendChild(track);
  var status = zone === 'good' ? 'on track'
    : zone === 'warn' ? 'close to target'
    : (def.goodDir === 'down' ? 'over target' : 'below target');
  var cap = el('div', 'meter-cap');
  cap.innerHTML = 'Target ' + esc(fmtTarget(key, t)) + ' · <span class="' + zone + '">' + status + '</span>';
  wrap.appendChild(cap);
  return wrap;
}

/* Revenue benchmark: this period vs the trailing monthly average. Shown only for
   single-month periods, where the monthly history is a like-for-like comparison. */
function revenueBenchmark(cur) {
  if (periodParts(state.period).type !== 'month') return null;
  var rev = cur.revenue;
  if (rev == null) return null;
  var t = trendSeries('revenue');
  if (!t) return null;
  var vals = t.values.slice(Math.max(0, t.values.length - 12)).filter(function (x) { return x != null; });
  if (vals.length < 2) return null;
  var avg = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  if (!(avg > 0)) return null;
  var below = rev < avg * 0.999;
  var above = rev > avg * 1.001;
  var scale = Math.max(rev, avg) * 1.4;
  var wrap = el('div', 'meter');
  var track = el('div', 'meter-track');
  var fl = el('div', 'meter-fill ' + (below ? 'bad' : 'good'));
  fl.style.width = Math.max(0, Math.min(100, (rev / scale) * 100)).toFixed(1) + '%';
  var mk = el('div', 'meter-mark');
  mk.style.left = Math.max(0, Math.min(100, (avg / scale) * 100)).toFixed(1) + '%';
  track.appendChild(fl); track.appendChild(mk);
  wrap.appendChild(track);
  var word = below ? 'below' : (above ? 'above' : 'in line');
  var cap = el('div', 'meter-cap');
  cap.innerHTML = 'Period average <b>' + esc(fmtMoney(avg, false)) + '</b> · <span class="' + (below ? 'bad' : 'good') + '">' + word + '</span>';
  wrap.appendChild(cap);
  return wrap;
}

/* 12-month history as bars, in the card's primary unit. Bars colour good/bad

   hover shows the month and value. Zero-baselined so a high cost reads as a tall bar. */
/* Instant hover tooltip for the trend bars - a native <title> is delayed and

    t.style.cssText = 'position:fixed;z-index:60;pointer-events:none;background:#0D0D0D;color:#fff;font-family:\'DM Sans\',sans-serif;font-size:12px;line-height:1.3;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .07s;box-shadow:0 4px 14px rgba(0,0,0,0.18)';
    document.body.appendChild(t);

}

    var tip = barTipEl();
    if (lab) { tip.textContent = lab; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = '1'; }

/* 12-month history as bars, built as real namespaced SVG nodes (not via innerHTML)
   with explicit inline sizing, so the chart can't collapse or balloon to the
   browser default. Bars colour good/bad vs target; the viewed month is outlined;
   hover shows month + value instantly. */
/* Short "17 Aug" label for a week-start bucket, for the trend tooltip. */
function fmtShortDate(s) {
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return s.getUTCDate() + ' ' + months[s.getUTCMonth()];
}

function trendBars(key, r) {
  /* Match the mini-trend's granularity to whatever period is selected, same
     as Manager view: Week shows the last few weeks (highlighting the current
     week's bar), everything else shows months - so the trend a card shows
     is never a different timescale than the period you're actually looking at. */
  var weekly = periodParts(state.period).type === 'week';
  var wrap = el('div', 'tbars');
  wrap.appendChild(el('div', 'tbars-cap', weekly
    ? 'Trend · last ' + MGR_WEEKLY_TREND_COUNT + ' weeks · hover a bar for detail'
    : 'Trend · last 12 months · hover a bar for detail'));
  var t = trendSeries(key, null, weekly ? 'weekly' : 'monthly');
  var nums = t ? t.values.filter(function (x) { return x != null; }) : [];
  if (!t || !nums.length) {
    wrap.appendChild(el('div', 'notconf-msg', weekly ? 'The trend fills in as weekly history comes in.' : 'The trend fills in as monthly history comes in.'));
    return wrap;
  }
  var n = t.values.length, start = weekly ? 0 : Math.max(0, n - 12);
  var buckets = t.months.slice(start), vals = t.values.slice(start);
  var shown = vals.filter(function (x) { return x != null; });
  var def = METRIC_DEFS[key], tgt = metricTarget(key);
  /* Widen the chart's own scale to always include the target, so the target
     line is never drawn off the top/bottom of the chart just because trade
     has been consistently over or under it. */
  var maxv = Math.max.apply(null, shown.concat([0], tgt != null ? [tgt] : []));
  var minv = Math.min.apply(null, shown.concat([0], tgt != null ? [tgt] : []));
  var span = (maxv - minv) || 1;
  var curBucket = weekly ? iso(r.from) : monthKey(r.from);
  var W = 280, H = 46, gap = 3, NS = 'http://www.w3.org/2000/svg';
  var bw = (W - gap * (vals.length - 1)) / vals.length;
  var zeroY = H - ((0 - minv) / span) * H;
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('role', 'img');
  svg.style.cssText = 'display:block;width:100%;height:46px';
  for (var i = 0; i < vals.length; i++) {
    if (vals[i] == null) continue;
    var x = i * (bw + gap);
    var vy = H - ((vals[i] - minv) / span) * H;
    var top = Math.min(vy, zeroY), h = Math.max(1.5, Math.abs(zeroY - vy));
    var cls = 'tbar';
    if (tgt != null) cls += ((def.goodDir === 'down') ? (vals[i] > tgt) : (vals[i] < tgt)) ? ' bad' : ' good';
    if (buckets[i] === curBucket) cls += ' cur';
    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('class', cls);
    rect.setAttribute('x', x.toFixed(1));
    rect.setAttribute('y', top.toFixed(1));
    rect.setAttribute('width', bw.toFixed(1));
    rect.setAttribute('height', h.toFixed(1));
    rect.setAttribute('rx', '1.5');
    var lab = weekly ? ('wk of ' + fmtShortDate(fromIso(buckets[i]))) : buckets[i];
    rect.setAttribute('data-lab', lab + ' · ' + trendLabel(key, vals[i]));
    svg.appendChild(rect);
  }
  /* A dashed line across the trend at the target level, so it's visible at a
     glance which bars cleared it and which didn't - not just the current one. */
  if (tgt != null) {
    var tY = H - ((tgt - minv) / span) * H;
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('class', 'ttarget-line');
    line.setAttribute('x1', '0'); line.setAttribute('x2', String(W));
    line.setAttribute('y1', tY.toFixed(1)); line.setAttribute('y2', tY.toFixed(1));
    line.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(line);
  }
  var holder = el('div', 'tbars-svg');
  holder.appendChild(svg);
  attachBarTip(holder);
  wrap.appendChild(holder);
  return wrap;
}
function trendLabel(key, v) {
  if (METRIC_DEFS[key].dual) return v.toFixed(1) + '%';
  if (METRIC_DEFS[key].fmt === 'int') return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return fmtMoney(v, false);
}

/* "Real sales mix" - actual food cost weighted by what Square says really
   sold, not an equal-weighted menu average. Shows which items to actually
   worry about (high volume x high cost), not just which have the worst %. */
function renderSalesMix(root, report) {
  var card = el('div', 'recon-card fade-in');
  var head = el('div', 'recon-head');
  head.appendChild(el('span', 'recon-metric', 'Real sales mix (Square)'));
  var periodWrap = el('span');
  [{ d: 28, label: '4 weeks' }, { d: 84, label: '12 weeks' }, { d: 182, label: '26 weeks' }].forEach(function (p) {
    var b = el('button', 'btn-tiny' + (costingState.salesPeriodDays === p.d ? ' btn-tiny-active' : ''), p.label);
    b.style.marginLeft = '0.35rem';
    b.onclick = function () { costingState.salesPeriodDays = p.d; costingState.salesLoaded = false; fetchItemSales(); render(); };
    periodWrap.appendChild(b);
  });
  head.appendChild(periodWrap);
  card.appendChild(head);

  if (costingState.salesError) {
    card.appendChild(el('div', 'recon-inst', esc(costingState.salesError)));
    root.appendChild(card);
    return;
  }
  if (!costingState.salesLoaded) {
    card.appendChild(el('div', 'recon-inst', 'Loading Square sales…'));
    root.appendChild(card);
    return;
  }
  if (costingState.salesData && costingState.salesData.connected === false) {
    card.appendChild(el('div', 'recon-inst', 'Square isn’t connected yet - connect it under Connections to see real sales-mix and actual food cost here.'));
    root.appendChild(card);
    return;
  }

  var mix = buildSalesMix(report);
  if (!mix || !mix.days) {
    card.appendChild(el('div', 'recon-inst', 'No Square sales data stored for this period yet - it backfills automatically in the background and will fill in over the next little while.'));
    root.appendChild(card);
    return;
  }

  var summaryLine = 'Over ' + mix.days + ' day' + (mix.days === 1 ? '' : 's') + ' of Square sales'
    + (mix.actualCogsPct != null ? ', actual sales-weighted food cost is ' : ', ')
    + (mix.actualCogsPct != null ? '<b class="' + costingPctClass(mix.actualCogsPct) + '">' + mix.actualCogsPct.toFixed(1) + '%</b> of revenue for matched items' : 'no matched items yet')
    + (report.overallPct != null ? ' (vs ' + report.overallPct.toFixed(1) + '% theoretical menu average).' : '.');
  card.appendChild(el('div', 'recon-inst', summaryLine));
  if (mix.matchedRevenueSharePct != null) {
    card.appendChild(el('div', 'recon-inst',
      mix.matchedRevenueSharePct.toFixed(0) + '% of Square revenue in this period matched to a recipe here; the rest is listed as "not matched" below - usually a naming difference between Square and the recipe name that’s easy to fix.'));
  }

  if (mix.matched.length) {
    var table = el('div', 'cost-table cost-table-mix');
    var thead = el('div', 'cost-row cost-row-head');
    thead.appendChild(el('span', 'cost-col-name', 'Item'));
    thead.appendChild(el('span', 'cost-col-num', 'Qty sold'));
    thead.appendChild(el('span', 'cost-col-num', 'Popularity'));
    thead.appendChild(el('span', 'cost-col-num', 'Revenue'));
    thead.appendChild(el('span', 'cost-col-num', 'Food cost'));
    thead.appendChild(el('span', 'cost-col-num', 'Item COGS%'));
    table.appendChild(thead);
    mix.matched.slice(0, 25).forEach(function (m) {
      var row = el('div', 'cost-row');
      row.appendChild(el('span', 'cost-col-name', esc(m.display)));
      row.appendChild(el('span', 'cost-col-num', m.qty % 1 === 0 ? String(m.qty) : m.qty.toFixed(1)));
      row.appendChild(el('span', 'cost-col-num', m.popularityPct.toFixed(1) + '%'));
      row.appendChild(el('span', 'cost-col-num', fmtMoney(m.revenue, true)));
      row.appendChild(el('span', 'cost-col-num', fmtMoney(m.foodCost, true)));
      var pctCell = el('span', 'cost-col-num' + (m.itemPct != null ? ' ' + costingPctClass(m.itemPct) : ''));
      pctCell.textContent = m.itemPct != null ? m.itemPct.toFixed(1) + '%' : '—';
      row.appendChild(pctCell);
      table.appendChild(row);
    });
    card.appendChild(table);
    if (mix.matched.length > 25) {
      card.appendChild(el('div', 'recon-inst', '+ ' + (mix.matched.length - 25) + ' more lower-revenue items not shown.'));
    }
  }

  if (mix.unmatched.length) {
    var unCard = el('div', 'recon-inst');
    unCard.style.marginTop = '0.6rem';
    var names = mix.unmatched.slice(0, 15).map(function (u) { return esc(u.name) + ' (' + (u.qty % 1 === 0 ? u.qty : u.qty.toFixed(1)) + ' sold)'; }).join(', ');
    unCard.innerHTML = '<b>Not matched to a recipe (' + mix.unmatched.length + '):</b> ' + names
      + (mix.unmatched.length > 15 ? ', + ' + (mix.unmatched.length - 15) + ' more' : '')
      + '. These sold in Square but the name doesn’t exactly match a recipe key here - rename either side (in Square, or via "Edit recipes & ingredients") to bring them into the sales-weighted numbers above.';
    card.appendChild(unCard);
  }

  root.appendChild(card);
}

  /* Known gaps / assumptions, always visible so nothing is silently guessed */
  var gaps = el('div', 'recon-card fade-in');

  gaps.appendChild(el('div', 'recon-inst',

    + '<li>Eggs: priced at the preferred 600g/$65 carton. When City Fine Food substitutes the 700g/$85 carton (out-of-stock), actual cost runs a little higher than shown here - not modelled per-week.</li>'
    + '<li>Avocado: Windsor Farm Shop prices by the tray with no printed count; using an estimated 5kg tray (~25 avocados at the ~200g you weighed) - update this if you get an exact count.</li>'
    + '<li>"Caramelised onion" is a $1 menu add-on with no ingredient recipe in the costing sheet at all, so it isn’t costed here.</li>'
    + '<li>"Bacon & egg burger" rarely sells and isn’t on the printed menu - shown at its last known sell price rather than a current one.</li>'
    + '<li>29 ingredients (mostly pantry items like sauces, spices and packaging) aren’t tracked in the weekly supplier check - these use the recipe sheet’s original price until they’re added to that tracker.</li>'
    + '<li>The main table above is still an equal-weighted menu average (every dish counted once). The "Real sales mix" section below is the sales-weighted version, from your actual Square sales - use that one for "what\'s really driving my food cost".</li>'

/* ---------- File upload (the guided-upload rung) ---------- */
function uploadPanel(s) {
  var wrap = el('div', 'conn-org');
  wrap.style.background = 'var(--c-purple-bg)';
  wrap.style.borderColor = 'var(--c-purple-border)';
  wrap.style.color = 'var(--c-purple-text)';
  wrap.innerHTML = '<b>Add data from a file.</b> Export the usual report from '
    + esc(s.name) + ' (or use the one it emails you), then drop it here. Your AI told you the upload code the first time.';

  var row = el('div', 'conn-actions');
  var file = document.createElement('input');
  file.type = 'file';
  file.accept = '.csv,.txt,.json,.tsv';
  file.style.fontSize = '12px';
  row.appendChild(file);

  var code = null;
  try { code = localStorage.getItem('vd_upcode'); } catch (e) {}
  var codeInput = null;
  if (!code) {
    codeInput = document.createElement('input');
    codeInput.type = 'password';
    codeInput.placeholder = 'Upload code';
    codeInput.style.cssText = 'font-family:DM Sans,sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--border-med);border-radius:8px;';
    row.appendChild(codeInput);
  }

  var btn = el('button', 'btn-small', 'Upload');
  var msg = el('div', 'conn-line');
  msg.style.marginTop = '0.4rem';
  btn.onclick = function () {
    var f = file.files && file.files[0];
    if (!f) { msg.textContent = 'Pick the exported file first.'; return; }
    var useCode = code || (codeInput && codeInput.value);
    if (!useCode) { msg.textContent = 'Enter the upload code your AI gave you.'; return; }
    btn.disabled = true;
    msg.textContent = 'Uploading\u2026';
    var reader = new FileReader();
    reader.onload = function () {
      fetch('/api/ingest?source=' + s.key, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + useCode, 'Content-Type': 'text/plain' },
        body: reader.result
      }).then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
        .then(function (out) {
          btn.disabled = false;
          if (out.ok && out.j.ok) {
            try { localStorage.setItem('vd_upcode', useCode); } catch (e) {}
            msg.textContent = 'Done: ' + out.j.days + ' day' + (out.j.days === 1 ? '' : 's') + ' of data added. Refreshing\u2026';
            fetchData();
          } else {
            msg.textContent = (out.j && out.j.plain) || 'That didn\u2019t work. Try again, or show your AI.';
          }
        })
        .catch(function () { btn.disabled = false; msg.textContent = 'That didn\u2019t work. Check your connection and try again.'; });
    };
    reader.readAsText(f);
  };
  row.appendChild(btn);
  wrap.appendChild(row);
  wrap.appendChild(msg);
  return wrap;
}

function renderManualEntry(root) {
  root.appendChild(el('div', 'screen-title', 'Enter your numbers'));
  root.appendChild(el('p', 'screen-sub', 'Type the figures from your own profit and loss and POS report. No accounts to connect and no code. Your dashboard fills in the moment you save, and it takes a couple of minutes each week.'));

  var ep = normalizePeriodKey(state.enterPeriod || (state.period === 'custom' ? 'week:-1' : state.period));
  state.enterPeriod = ep;
  var epp = periodParts(ep);
  var pbar = el('div', 'period-bar');
  pbar.appendChild(el('span', 'period-label', 'Which dates'));
  PERIOD_TYPES.forEach(function (pt) {
    if (pt.type === 'custom') return;
    var c = el('button', 'pchip' + (epp.type === pt.type ? ' on' : ''), pt.label);
    c.onclick = function () { state.enterPeriod = periodKey(pt.type, epp.type === pt.type ? epp.offset : (pt.type === 'week' ? -1 : 0)); render(); };

  });

  var enav = el('div', 'period-nav');

  enav.appendChild(ePrev);
  enav.appendChild(el('span', 'nav-current', periodLabel(ep)));
  var eNext = el('button', 'nav-arrow', '›');
  eNext.disabled = epp.offset >= 0;
  eNext.onclick = function () { if (epp.offset < 0) { state.enterPeriod = periodKey(epp.type, epp.offset + 1); render(); } };
  enav.appendChild(eNext);
  root.appendChild(enav);

  var r = resolvePeriod(ep);
  root.appendChild(el('p', 'manual-dates', 'You are entering numbers for ' + fmtRange(r) + '.'));

  var existing = manualEntry({ from: r.from, to: r.to });
  var vals = (existing && existing.values) ? existing.values : {};
  var fields = manualNeededFieldKeys();
  var inputs = {};
  var grid = el('div', 'set-grid');
  fields.forEach(function (fk) {
    var fdef = MANUAL_FIELDS.filter(function (x) { return x.key === fk; })[0];
    var cell = el('div', 'set-cell');
    cell.appendChild(el('div', 'set-label', esc(fdef.label)));
    var inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any'; inp.min = '0';
    if (typeof vals[fk] === 'number') inp.value = vals[fk];
    inp.placeholder = fdef.kind === 'int' ? 'e.g. 540' : (KIT_CONFIG.currency + ' amount');
    inputs[fk] = inp;
    cell.appendChild(inp);
    cell.appendChild(el('div', 'set-note', esc(fdef.help)));
    grid.appendChild(cell);
  });
  root.appendChild(grid);

  var att = el('div', 'manual-attest');
  var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'attest';
  if (existing && existing.attested) cb.checked = true;

  lab.textContent = 'These figures are from my own profit and loss and POS report for these dates.';
  att.appendChild(cb); att.appendChild(lab);
  root.appendChild(att);

  var errLine = el('div', 'err-line'); errLine.style.display = 'none';
  root.appendChild(errLine);

  var saveBtn = el('button', 'btn-primary-dash', 'Save these numbers');
  saveBtn.onclick = function () {
    if (!cb.checked) { errLine.textContent = 'Please tick the box to confirm these are your own figures.'; errLine.style.display = 'block'; return; }
    var newVals = {}; var any = false;
    fields.forEach(function (fk) {
      var raw = inputs[fk].value;
      if (raw !== '' && isFinite(parseFloat(raw))) { newVals[fk] = parseFloat(raw); any = true; }
    });
    if (!any) { errLine.textContent = 'Enter at least one number before saving.'; errLine.style.display = 'block'; return; }
    MANUAL[rangeKey(r.from, r.to)] = { from: iso(r.from), to: iso(r.to), period: ep, values: newVals, attested: true, enteredAt: new Date().toISOString() };

    fetchData();

  var keys = Object.keys(MANUAL).sort().reverse();
  if (keys.length) {
    root.appendChild(el('div', 'section-sub', 'Saved so far'));
    keys.forEach(function (k) {
      var e = MANUAL[k];
      root.appendChild(el('div', 'manual-row', esc(fmtRange({ from: fromIso(e.from), to: fromIso(e.to) })) + ' \u00b7 saved'));
    });
  }
}

  vn.oninput = function () { if (vn.value) { SETTINGS.venueName = vn.value; saveSettings(); } };

  var ro = document.createElement('select');
  for (var h = 0; h <= 6; h++) {
    var o2 = document.createElement('option'); o2.value = h;
    o2.textContent = (h === 0) ? 'Midnight (no rollover)' : (h + 'am');
    if (+SETTINGS.rolloverHour === h) o2.selected = true;
    ro.appendChild(o2);
  }
  ro.onchange = function () { SETTINGS.rolloverHour = +ro.value; saveSettings(); fetchData(); };
  c4.appendChild(ro);
  c4.appendChild(el('div', 'set-note', 'If you trade past midnight, sales before this hour count to the previous day.'));
  grid.appendChild(c4);

  var c5 = el('div', 'set-cell');
  c5.appendChild(el('div', 'set-label', 'Timezone'));
  var tzSel = document.createElement('select');
  (TZ_CHOICES[KIT_CONFIG.region] || [SETTINGS.timezone]).forEach(function (z) {
    var o = document.createElement('option'); o.value = z; o.textContent = z.split('/')[1].replace('_', ' ');
    if (SETTINGS.timezone === z) o.selected = true;
    tzSel.appendChild(o);
  });
  tzSel.onchange = function () { SETTINGS.timezone = tzSel.value; saveSettings(); fetchData(); };
  c5.appendChild(tzSel);
  grid.appendChild(c5);

  var c6 = el('div', 'set-cell');
  c6.appendChild(el('div', 'set-label', 'Accent colour'));
  var sw = el('div', 'swatches');
  ACCENTS.forEach(function (a) {
    var s = el('div', 'swatch' + (SETTINGS.accent === a.key ? ' on' : ''));
    s.style.background = a.c;
    s.title = a.key;
    s.onclick = function () { SETTINGS.accent = a.key; saveSettings(); render(); };
    sw.appendChild(s);
  });
  c6.appendChild(sw);
  grid.appendChild(c6);

  root.appendChild(grid);

  /* Targets and alerts (Monday-review thresholds) */
  root.appendChild(el('div', 'screen-title', 'Targets and alerts'));
  root.appendChild(el('p', 'screen-sub', 'Set the level you want each number to stay on the right side of. Cost and profit targets are a share of revenue (30 means 30% of revenue); transaction and spend targets are a plain number. A card flags amber when it slips to the wrong side. Revenue is shown against its own recent average instead of a fixed target.'));
  var tgrid = el('div', 'set-grid');
  CHOSEN.forEach(function (k) {
    var mdef = METRIC_DEFS[k];
    if (mdef.benchmark) return;
    var cell = el('div', 'set-cell');
    cell.appendChild(el('div', 'set-label', esc(mdef.label) + (mdef.dual ? ' (% of revenue)' : '')));
    var inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any';
    inp.value = (SETTINGS.targets && typeof SETTINGS.targets[k] === 'number') ? SETTINGS.targets[k] : '';
    inp.placeholder = (mdef.goodDir === 'down' ? 'alert if above' : 'alert if below');
    /* Same fix as Venue name above: save on every keystroke, not just on blur,
       so a quick tap straight to another nav tab can never race past an unsaved
       edit and make it look like the target "reverted". */
    inp.oninput = function () {
      var val = parseFloat(inp.value);
      if (isFinite(val)) { if (!SETTINGS.targets) SETTINGS.targets = {}; SETTINGS.targets[k] = val; saveSettings(); }
    };
    inp.onchange = function () {
      if (!SETTINGS.targets) SETTINGS.targets = {};
      var val = parseFloat(inp.value);
      if (isFinite(val)) SETTINGS.targets[k] = val; else delete SETTINGS.targets[k];
      saveSettings(); render();
    };
    cell.appendChild(inp);
    var unit = mdef.dual ? 'percent of revenue' : (mdef.fmt === 'int' ? 'count' : KIT_CONFIG.currency);
    cell.appendChild(el('div', 'set-note', (mdef.goodDir === 'down' ? 'Alerts when above this ' : 'Alerts when below this ') + unit + '.'));
    tgrid.appendChild(cell);
  });
  root.appendChild(tgrid);

  if (!isManual()) {
    root.appendChild(el('div', 'section-sub', 'Session'));
    var logoutBtn = el('button', 'btn-plain', 'Log out');
    logoutBtn.onclick = function () { fetch('/api/logout', { method: 'POST' }).then(function () { location.reload(); }); };
    root.appendChild(logoutBtn);
  }
}

/* ============================================================
   Boot
============================================================ */
state.period = normalizePeriodKey(SETTINGS.defaultPeriod) || 'week:0';
render();
fetchData();
fetchIngredientPrices();
fetchRecipes();
fetchItemSales();
</script>
</body>
</html>
