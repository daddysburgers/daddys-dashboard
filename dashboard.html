<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your venue dashboard</title>
<!-- ============================================================
  Dashboard scaffold (ships in the FC Member Dashboard Kit).
  Built for the owner's AI to wire data into - do not rebuild it.
  - All metric maths follows kpi-spec.md (locked definitions).
  - The Worker (worker.js) supplies raw source data; THIS file computes
    the metrics, so the locked definitions live in exactly one place.
  - No FC identity anywhere: this is the owner's own tool.
  - JS rules: no template literals, apostrophes as ’ in JS strings,
    dynamic screens built with DOM methods.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Brand: dark background, white + yellow. Gold is chrome only - buttons,
     the active pill/tab, headings, one accent mark - never a data or status
     color. Re-validated against THIS dark surface (#111111), not just
     re-used from the old light palette - gold, and every status color, was
     re-picked and checked with scripts/validate_palette.js for CVD
     separation and normal-vision distinctness against each other and
     against black text/backgrounds, not eyeballed. --black/--white keep
     their names for every rule that already references them, but now carry
     the opposite roles: --black is the "ink" used for headings/values (light,
     since the page is dark), --white is the lifted card/input surface (a
     dark gray, not the page's near-black). --ink-on-accent is the one
     literal exception - text sitting ON a gold-filled surface (buttons, the
     active tab/chip) needs to stay dark for contrast no matter the theme. */
  --gold:        #FDE047;
  --gold-dim:    rgba(253,224,71,0.14);
  --ink-on-accent: #14110A;
  --black:       #F5F5F0;
  --white:       #1A1A1A;
  --cream:       #111111;   /* page background */
  --cream2:      #232323;   /* hover / disabled surface */
  --cream3:      #2E2E2E;   /* track / divider background */
  --muted:       #9A9A94;
  --text:        #EDEDE8;
  --border:      rgba(255,255,255,0.10);
  --border-med:  rgba(255,255,255,0.22);
  --c-teal:        #0E8A6E;
  --c-teal-bg:     #E6F5F1;
  --c-teal-border: rgba(14,138,110,0.15);
  --c-teal-text:   #0a4a3a;
  --c-blue:        #1A5FB4;
  --c-blue-bg:     #E8F0FB;
  --c-blue-border: rgba(26,95,180,0.15);
  --c-blue-text:   #0f3470;
  --c-purple:        #5C3DB0;
  --c-purple-bg:     #EDE8FA;
  --c-purple-border: rgba(92,61,176,0.15);
  --c-purple-text:   #33216b;
  /* Traffic-light target status - a closed system reserved for on/close/over
     target only, kept clear of brand gold (checked for colorblind separation,
     not eyeballed) so color never means two different things on one screen. */
  --c-amber:        #F59E0B;
  --c-amber-bg:     #FCF3D9;
  --c-amber-border: rgba(202,138,4,0.22);
  --c-coral:        #EF4444;
  --c-coral-bg:     #FBE9E9;
  --c-coral-border: rgba(220,38,38,0.2);
  --c-green:        #34D399;
  --c-green-bg:     #E7F5EC;
  --c-green-border: rgba(21,128,61,0.2);
  --accent: var(--gold);
  --accent-dim: rgba(253,224,71,0.14);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}
#app { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }

/* Top bar: the owner's name for the venue, no other identity */
.topbar { display: flex; align-items: baseline; gap: 1rem; padding: 2rem 0 0.4rem; flex-wrap: wrap; }
.venue-name { font-family: 'Khand', sans-serif; font-size: 40px; font-weight: 700; color: var(--black); line-height: 1; letter-spacing: -0.01em; }
.topbar-sub { font-size: 13px; color: var(--muted); font-weight: 300; }
.top-rule { width: 48px; height: 3px; background: var(--accent); border-radius: 2px; margin: 0.4rem 0 1rem; }

/* Nav tabs */
.nav { display: flex; gap: 6px; margin-bottom: 1.1rem; flex-wrap: wrap; }
.nav-tab {
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  padding: 9px 18px; border-radius: 50px; border: 1px solid var(--border-med);
  background: transparent; color: var(--text); cursor: pointer; transition: all .15s;
}
.nav-tab:hover { background: var(--cream2); }
.nav-tab.active { background: var(--accent); color: var(--ink-on-accent); border-color: var(--accent); }
.nav-tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c-coral); margin-left: 7px; vertical-align: 1px; }

/* Banners */
.banner { border-radius: 12px; padding: 0.85rem 1.1rem; font-size: 14px; line-height: 1.55; margin-bottom: 0.9rem; border: 1px solid transparent; }
.banner b { font-weight: 500; }
.banner-amber { background: var(--c-amber-bg); border-color: var(--c-amber-border); color: var(--c-amber-text, #5a3c00); }
.banner-coral { background: var(--c-coral-bg); border-color: var(--c-coral-border); color: #6b2510; }
.banner-link { color: inherit; font-weight: 500; text-decoration: underline; cursor: pointer; }

/* Period bar */
.control-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 0.5rem; }
.control-left { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.control-right { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.period-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 0.4rem; }
.period-label { font-family: 'Khand', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-right: 2px; }
.pchip {
  font-size: 13px; font-weight: 400; padding: 8px 15px; border-radius: 50px;
  border: 1px solid var(--border-med); background: var(--white); color: var(--text);
  cursor: pointer; transition: all .15s; user-select: none;
}
.pchip:hover { border-color: var(--accent); background: var(--accent-dim); }
.pchip.on { background: var(--accent); color: var(--ink-on-accent); border-color: var(--accent); font-weight: 500; }
.period-nav { display: flex; align-items: center; gap: 10px; margin: 2px 0 0.6rem; }
.nav-arrow {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-med); background: var(--white);
  color: var(--text); font-size: 17px; line-height: 1; cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif;
}
.nav-arrow:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-dim); }
.nav-arrow:disabled { opacity: 0.35; cursor: default; }
.nav-current { font-size: 13px; color: var(--muted); font-weight: 500; }
.nav-today {
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 13px;
  border-radius: 50px; border: 1px solid var(--border-med); background: transparent; color: var(--text); cursor: pointer;
}
.nav-today:hover { border-color: var(--accent); background: var(--accent-dim); }
.custom-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0.5rem 0; }
.custom-wrap input[type=date] {
  font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--border-med); border-radius: 9px; background: var(--white); color: var(--text);
}
.btn-small {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 16px;
  border-radius: 9px; border: none; background: var(--accent); color: var(--ink-on-accent); cursor: pointer;
}
.btn-small:disabled { opacity: 0.5; cursor: default; }
.btn-plain {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 16px;
  border-radius: 9px; border: 1px solid var(--border-med); background: transparent; color: var(--text); cursor: pointer;
}
.btn-plain:hover { background: var(--cream2); }

/* Freshness row */
.fresh-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin: 0.2rem 0 1.1rem; flex-wrap: wrap; }
.fresh-row .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(242,169,0,0.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Period heading */
.period-heading { font-family: 'Khand', sans-serif; font-size: 21px; font-weight: 600; color: var(--black); margin: 0 0 0.9rem; }
.period-heading span { color: var(--muted); font-weight: 500; }

/* Metric cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.mcard {
  background: var(--white); border: 1px solid var(--border); border-radius: 16px;
  padding: 1.25rem 1.35rem 1.1rem; position: relative; overflow: hidden;
}
.mcard.needs-check { border-color: var(--c-coral-border); box-shadow: inset 4px 0 0 var(--c-coral); }
.mcard.not-conf { background: var(--cream2); border-style: dashed; }
.m-label { font-family: 'Khand', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
.m-value { font-family: 'Khand', sans-serif; font-size: 42px; font-weight: 700; color: var(--black); line-height: 1; margin-bottom: 0.15rem; }
.m-value.dim { color: var(--muted); font-size: 30px; }
.m-sub { font-size: 13px; color: var(--muted); margin-bottom: 0.55rem; }
.m-sub.warn { color: var(--c-amber); }
.m-def { font-size: 12px; color: var(--muted); font-weight: 300; line-height: 1.55; border-top: 1px solid var(--border); padding-top: 0.55rem; margin-top: 0.55rem; }
.m-tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; margin-bottom: 8px; }
.tag-check { background: var(--c-coral-bg); color: var(--c-coral); border: 1px solid var(--c-coral-border); }
.tag-unverified { background: var(--c-amber-bg); color: var(--c-amber); border: 1px solid var(--c-amber-border); }
.tag-proj { background: var(--c-purple-bg); color: var(--c-purple); border: 1px solid var(--c-purple-border); }
.cmp-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 3px 0; }
.cmp-lab { color: var(--muted); font-weight: 300; }
.cmp-val { font-weight: 500; }
.good { color: var(--c-green); } .warn { color: var(--c-amber); } .bad { color: var(--c-coral); } .flat { color: var(--muted); }
.sparkwrap { margin-top: 0.6rem; }
.spark-cap { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2px; }
.notconf-msg { font-size: 13px; color: var(--muted); line-height: 1.6; }
.mcard.alert { border-color: var(--c-coral-border); box-shadow: inset 4px 0 0 var(--c-coral); }
.tag-alert { background: var(--c-amber-bg); color: var(--c-amber); border: 1px solid var(--c-amber-border); }
.m-alert { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--c-amber); font-weight: 500; margin: 0 0 0.5rem; }
.m-decision { font-size: 12px; color: var(--muted); font-weight: 300; line-height: 1.55; margin-top: 0.45rem; }
.m-decision b { color: var(--text); font-weight: 500; }

/* Sections shared */
.screen-title { font-family: 'Khand', sans-serif; font-size: 26px; font-weight: 600; color: var(--black); margin: 0.4rem 0 0.3rem; }
.screen-sub { font-size: 14px; color: var(--muted); font-weight: 300; line-height: 1.7; max-width: 640px; margin-bottom: 1.2rem; }

/* Connections */
.conn-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem 1.3rem; margin-bottom: 10px; }
.conn-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 0.3rem; }
.conn-name { font-family: 'Khand', sans-serif; font-size: 19px; font-weight: 600; color: var(--black); }
.conn-pill { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; }
.pill-ok { background: var(--c-green-bg); color: var(--c-green); border: 1px solid var(--c-green-border); }
.pill-off { background: var(--cream2); color: var(--muted); border: 1px dashed var(--border-med); }
.pill-warn { background: var(--c-coral-bg); color: var(--c-coral); border: 1px solid var(--c-coral-border); }
.conn-line { font-size: 13px; color: var(--muted); line-height: 1.65; }
.conn-org { background: var(--c-blue-bg); border: 1px solid var(--c-blue-border); color: var(--c-blue-text); border-radius: 10px; padding: 0.65rem 0.9rem; font-size: 13px; margin: 0.6rem 0; line-height: 1.6; }
.conn-actions { display: flex; gap: 8px; margin-top: 0.6rem; flex-wrap: wrap; }
.cb-url { font-size: 12px; color: var(--muted); word-break: break-all; background: var(--cream2); border-radius: 8px; padding: 0.5rem 0.7rem; margin-top: 0.55rem; }

/* Reconciliation */
.recon-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem 1.3rem; margin-bottom: 10px; }
.recon-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.recon-metric { font-family: 'Khand', sans-serif; font-size: 19px; font-weight: 600; color: var(--black); }
.recon-fig { font-family: 'Khand', sans-serif; font-size: 24px; font-weight: 700; color: var(--black); }
.recon-inst { font-size: 13.5px; color: var(--text); font-weight: 300; line-height: 1.7; margin: 0.5rem 0 0.7rem; }
.recon-state { font-size: 12px; font-weight: 500; }
.diag { background: var(--c-coral-bg); border: 1px solid var(--c-coral-border); border-radius: 10px; padding: 0.8rem 1rem; margin-top: 0.7rem; font-size: 13px; color: #6b2510; line-height: 1.7; }
.diag ol { margin: 0.3rem 0 0 1.1rem; }

/* Recipe costing */
.cost-table { display: flex; flex-direction: column; margin-top: 0.4rem; }
.cost-row { display: grid; grid-template-columns: 1fr 90px 90px 80px; gap: 8px; align-items: center; padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.cost-row:last-child { border-bottom: none; }
.cost-row-head { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
.cost-row-batch { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.cost-row-batch:last-child { border-bottom: none; }
.cost-row-batch .cost-col-num { color: var(--muted); font-size: 12.5px; text-align: right; }
.cost-row-over { background: var(--c-coral-bg); border-radius: 8px; }
.cost-row-over .cost-col-name, .cost-row-over .cost-col-num { color: #6b2510; }
.cost-row-over .cost-tag { color: #6b2510; background: rgba(107,37,16,0.1); }
.cost-table-mix .cost-row { grid-template-columns: 1fr 70px 80px 90px 90px 80px; }
@media (max-width: 640px) { .cost-table-mix .cost-row { grid-template-columns: 1fr 55px 60px; font-size: 12px; } .cost-table-mix .cost-col-num:nth-child(4), .cost-table-mix .cost-col-num:nth-child(5) { display: none; } }
.cost-col-name { color: var(--black); }
.cost-col-num { text-align: right; font-variant-numeric: tabular-nums; }
.cost-tag { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--cream2); border-radius: 6px; padding: 1px 6px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.02em; }
.cost-ing-list { display: flex; flex-direction: column; gap: 6px; margin-top: 0.5rem; }
.cost-ing-row { display: grid; grid-template-columns: 160px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.cost-ing-name { color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cost-ing-barwrap { background: var(--cream2); border-radius: 6px; height: 10px; overflow: hidden; }
.cost-ing-bar { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.cost-ing-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.cost-tag-bad { color: #6b2510; background: var(--c-coral-bg); }
.btn-tiny { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 7px; cursor: pointer; margin-left: 8px; }
.btn-tiny:hover { color: var(--c-coral); border-color: var(--c-coral-border); }
.btn-tiny-active { color: var(--accent); border-color: var(--accent); }
.cost-inp { width: 70px; background: var(--cream2); border: 1px solid var(--border); border-radius: 6px; color: var(--black); font-size: 13px; padding: 3px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.cost-inp-wide { flex: 1; min-width: 140px; background: var(--cream2); border: 1px solid var(--border); border-radius: 6px; color: var(--black); font-size: 13px; padding: 3px 8px; }
.cost-edit-item { background: var(--cream2); border-radius: 10px; padding: 0.8rem 0.9rem; margin-bottom: 10px; }
.cost-edit-title { font-weight: 600; color: var(--black); font-size: 14.5px; }
.cost-edit-fields { display: flex; flex-wrap: wrap; gap: 12px; margin: 0.5rem 0 0.6rem; align-items: center; }
.cost-edit-field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.cost-edit-flabel { white-space: nowrap; }
.cost-row-batch input.cost-inp-wide { margin-right: 8px; }
.cost-row-batch input.cost-inp { margin-right: 8px; }

/* Settings */
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-width: 760px; }
.set-cell { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; }
.set-label { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
.set-cell input[type=text], .set-cell select, .set-cell input[type=number] {
  width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 11px;
  border: 1px solid var(--border-med); border-radius: 9px; background: var(--white); color: var(--text);
}
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.swatch.on { border-color: var(--black); }
.set-note { font-size: 12px; color: var(--muted); font-weight: 300; line-height: 1.6; margin-top: 0.5rem; }
.tag-manual { background: var(--c-blue-bg); color: var(--c-blue-text); border: 1px solid var(--c-blue-border); }
.mode-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; max-width: 760px; margin-bottom: 1.6rem; }
.mode-card { background: var(--white); border: 1px solid var(--border-med); border-radius: 14px; padding: 1rem 1.2rem; cursor: pointer; transition: all 0.15s; }
.mode-card:hover { border-color: var(--accent); }
.mode-card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-dim); }
.mode-t { font-family: 'Khand', sans-serif; font-size: 17px; font-weight: 600; color: var(--black); margin-bottom: 3px; }
.mode-d { font-size: 12.5px; color: var(--muted); line-height: 1.55; font-weight: 300; }
.manual-dates { font-size: 14px; color: var(--text); font-weight: 400; margin: 0.2rem 0 1.1rem; }
.manual-attest { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--text); margin: 1.1rem 0; max-width: 760px; line-height: 1.5; }
.manual-attest input { margin-top: 3px; flex-shrink: 0; }
.err-line { color: var(--c-coral); font-size: 13px; margin: 0.5rem 0; }
.btn-primary-dash { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; color: var(--ink-on-accent); background: var(--accent); border: none; border-radius: 10px; cursor: pointer; }
.section-sub { font-family: 'Khand', sans-serif; font-size: 16px; font-weight: 600; color: var(--black); margin: 1.8rem 0 0.5rem; }
.manual-row { font-size: 13px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--border); }

/* Footer */
.dash-footer { margin-top: 2.4rem; padding-top: 1.3rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 300; }
.dash-footer a { color: var(--muted); }

.fade-in { animation: fadeUp 0.45s cubic-bezier(0.4,0,0.2,1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 640px) {
  .venue-name { font-size: 30px; }
  .m-value { font-size: 34px; }
}
/* ---- §1 dashboard upgrade: dual headline, meters, trend bars ---- */
.m-figs { display: flex; align-items: flex-end; gap: 1.6rem; flex-wrap: wrap; margin-bottom: 0.15rem; }
.m-fig { display: flex; flex-direction: column; }
.m-pri { font-family: 'Khand', sans-serif; font-size: 42px; font-weight: 700; color: var(--black); line-height: 0.95; }
.m-fig.sec .m-pri { font-size: 32px; color: var(--text); }
.m-pri.loss { color: var(--c-coral); }
.m-unit { font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.meter { margin: 0.55rem 0 0.5rem; }
.meter-track { position: relative; height: 8px; border-radius: 5px; background: var(--cream3); }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; min-width: 2px; }
.meter-fill.good { background: var(--c-green); }
.meter-fill.bad { background: var(--c-coral); }
.meter-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 2px; }
.meter-cap { font-size: 12px; color: var(--muted); margin-top: 6px; }
.meter-cap b { color: var(--text); font-weight: 600; }
.meter-cap .good { color: var(--c-green); font-weight: 500; }
.meter-cap .warn { color: var(--c-amber); font-weight: 500; }
.meter-cap .bad { color: var(--c-coral); font-weight: 500; }
.tbars { margin-top: 0.7rem; }
.tbars-cap { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 5px; }
.tbars svg { display: block; width: 100%; height: 46px; }
.tbar { fill: var(--accent); }
.tbar.good { fill: var(--c-green); }
.tbar.bad { fill: var(--c-coral); }
.tbar.cur { stroke: var(--text); stroke-width: 0.8; }
.tbar { cursor: default; }
.tbar:hover { opacity: 0.78; }
.ttarget-line { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 2; opacity: 0.55; pointer-events: none; }

/* 3-zone target meter (on target / close / over) - the same red/amber/green
   used everywhere else a target is judged, never a 2-color good/bad only. */
.meter-fill.warn { background: var(--c-amber); }
.meter-zone { position: absolute; top: 0; bottom: 0; opacity: 0.25; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.status-dot.good { background: var(--c-green); }
.status-dot.warn { background: var(--c-amber); }
.status-dot.bad { background: var(--c-coral); }

/* ---- Manager view ---- */
.talking-lab { font-family: 'Khand', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-right: 2px; }
.takeaway { background: var(--white); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; margin: 0.6rem 0 1rem; }
.takeaway .mark { color: var(--gold); font-family: 'Khand', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.15; flex: none; }
.takeaway p { margin: 0; font-size: 14.5px; line-height: 1.55; }
.takeaway b { color: var(--gold); font-weight: 700; }
.callback { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); margin: -0.4rem 0 1rem; padding-left: 2px; }
.callback .ok { color: var(--c-green); font-weight: 500; }
.callback .open { color: var(--c-coral); font-weight: 500; }
.mgr-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 6px 0 4px; margin-bottom: 20px; }
.mgr-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 20px 4px; }
.mgr-title { font-family: 'Khand', sans-serif; font-size: 21px; font-weight: 700; color: var(--black); }
.mgr-when { font-size: 12.5px; color: var(--muted); }
.mgr-row { display: flex; align-items: center; gap: 16px; padding: 13px 20px; border-top: 1px solid var(--border); }
.mgr-row:first-of-type { border-top: none; }
.mgr-lab { width: 150px; flex: none; font-size: 13px; font-weight: 600; color: var(--text); }
.mgr-lab .tgt { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
.mgr-viz { flex: 1; min-width: 0; }
.mgr-val { width: 118px; flex: none; text-align: right; }
.mgr-cell-val { display: block; font-family: 'Khand', sans-serif; font-size: 20px; font-weight: 700; color: var(--black); font-variant-numeric: tabular-nums; }
.mgr-cell-delta { display: block; font-size: 11px; margin-top: 1px; font-weight: 600; }
.mgr-cell-delta.good { color: var(--c-green); }
.mgr-cell-delta.warn { color: var(--c-amber); }
.mgr-cell-delta.bad { color: var(--c-coral); }
.mgr-spark { display: flex; align-items: flex-end; gap: 3px; height: 30px; position: relative; }
.mgr-spark div { flex: 1; border-radius: 2px 2px 0 0; background: rgba(253,224,71,0.5); min-height: 2px; }
.mgr-spark div.cur { background: var(--gold); }
.mgr-spark div.good { background: var(--c-green); }
.mgr-spark div.bad { background: var(--c-coral); }
.mgr-target-line { position: absolute; left: 0; right: 0; height: 0; flex: none; min-height: 0; border-top: 1px dashed var(--text); opacity: 0.55; background: none; pointer-events: none; }
.mgr-meter-track { position: relative; height: 10px; border-radius: 5px; background: var(--cream3); overflow: hidden; }
@media print {
  .nav, .control-bar, .fresh-row, #go-conn, .btn-plain, .mgr-print-btn { display: none !important; }
  body { background: var(--white); }
  .mgr-card { border: none; }
}
</style>

<body>
<div id="app">
  <noscript><p style="padding:2rem 0">This dashboard needs JavaScript turned on.</p></noscript>
</div>
<script>
'use strict';

/* ============================================================
   KIT CONFIG - filled by the kit when it was built.
   The defaults below are only for previewing the scaffold.
============================================================ */
/*KIT_CONFIG_START*/
var KIT_CONFIG = {
  "region": "AU",
  "fyStartMonth": 7,
  "fyLabel": "1 July to 30 June",
  "taxLabel": "ex-GST",
  "currency": "$",
  "providers": {
    "accounting": "Xero",
    "pos": "Square",
    "rostering": "Connect Teams"
  },
  "metrics": [
    "revenue",
    "transactions",
    "acs",
    "cogs",
    "wage",
    "overheads",
    "profit"
  ],
  "startLevel": "live",
  "kitDate": "August 2026",
  "feedbackUrl": ""
};
/*KIT_CONFIG_END*/

/* ============================================================
   Settings (owner-editable in the Settings screen, never in code)
============================================================ */
var TZ_DEFAULTS = { AU: 'Australia/Sydney', NZ: 'Pacific/Auckland', US: 'America/New_York' };
var TZ_CHOICES = {
  AU: ['Australia/Sydney','Australia/Melbourne','Australia/Brisbane','Australia/Adelaide','Australia/Perth','Australia/Hobart','Australia/Darwin'],
  NZ: ['Pacific/Auckland','Pacific/Chatham'],
  US: ['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','Pacific/Honolulu','America/Anchorage']
};
var ACCENTS = [
  { key: 'gold',   c: '#F2A900', dim: 'rgba(242,169,0,0.12)' },
  { key: 'teal',   c: '#0E8A6E', dim: 'rgba(14,138,110,0.12)' },
  { key: 'blue',   c: '#1A5FB4', dim: 'rgba(26,95,180,0.12)' },
  { key: 'coral',  c: '#C04B28', dim: 'rgba(192,75,40,0.12)' },
  { key: 'purple', c: '#5C3DB0', dim: 'rgba(92,61,176,0.12)' },
  { key: 'green',  c: '#1A7A3C', dim: 'rgba(26,122,60,0.12)' }
];

function defaultSettings() {
  return {
    venueName: 'Your venue',
    defaultPeriod: 'month:0',
    weekStart: 1,            /* 1 = Monday */
    rolloverHour: 0,         /* sales before this hour count to the previous trading day */
    timezone: TZ_DEFAULTS[KIT_CONFIG.region] || 'Australia/Sydney',
    accent: 'gold',
    dataMode: KIT_CONFIG.startLevel === 'manual' ? 'manual' : 'live',
    location: 'combined',    /* combined | windsor | richmond */
    targets: { cogs: 30, wage: 30, overheads: 30, profit: 10 }
  };
}
function loadSettings() {
  try {
    var raw = localStorage.getItem('vd_settings');
    if (!raw) return defaultSettings();
    var s = JSON.parse(raw);
    var d = defaultSettings();
    for (var k in d) { if (!(k in s)) s[k] = d[k]; }
    if (s.defaultPeriod) s.defaultPeriod = normalizePeriodKey(s.defaultPeriod);
    return s;
  } catch (e) { return defaultSettings(); }
}
function saveSettings() { try { localStorage.setItem('vd_settings', JSON.stringify(SETTINGS)); } catch (e) {} }
var SETTINGS = loadSettings();

function loadJson(key, fallback) {
  try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}
var RECON = loadJson('vd_recon', {});          /* metricKey -> 'confirmed' | 'flagged' */
var ORG_OK = loadJson('vd_orgok', {});         /* sourceKey -> true */
var MANUAL = loadJson('vd_manual', {});        /* rangeKey -> { from,to,period,values,attested,enteredAt } */
function saveRecon() { try { localStorage.setItem('vd_recon', JSON.stringify(RECON)); } catch (e) {} }
function saveOrgOk() { try { localStorage.setItem('vd_orgok', JSON.stringify(ORG_OK)); } catch (e) {} }
function saveManual() { try { localStorage.setItem('vd_manual', JSON.stringify(MANUAL)); } catch (e) {} }
/* Per-period owner-entered figures overlaid on LIVE data (hybrid): rangeKey ->
   { revenue?, cogs? }. Wages (Xero) and transactions (Square) stay live; these
   attested figures replace just the fields the owner types, badged "Entered by you". */
var OVERRIDES = loadJson('vd_overrides', {});
function saveOverrides() { try { localStorage.setItem('vd_overrides', JSON.stringify(OVERRIDES)); } catch (e) {} }
/* Uber Eats orders, per shop, per period: rangeKey -> { windsor?, richmond? }.
   Square never sees these (a separate channel), so unlike OVERRIDES this is
   ADDED ON TOP of the live Square count rather than replacing it. */
var UBER = loadJson('vd_uber', {});
function saveUber() { try { localStorage.setItem('vd_uber', JSON.stringify(UBER)); } catch (e) {} }
function isManual() { return SETTINGS.dataMode === 'manual'; }
function rangeKey(from, to) { return iso(from) + '_' + iso(to); }

/* ============================================================
   Metric catalogue - mirrors kpi-spec.md (locked definitions).
   Values are computed HERE from raw source data, in one place.
============================================================ */
var P = KIT_CONFIG.providers;
var METRIC_DEFS = {
  revenue:      { label: 'Revenue', fmt: 'money', needs: ['accounting'], goodDir: 'up', benchmark: true,
                  def: 'All trading income, ' + KIT_CONFIG.taxLabel + ' · from ' + P.accounting,
                  decision: 'Is the top line growing? Sets the base every other number is judged against.' },
  transactions: { label: 'Number of transactions', fmt: 'int', needs: ['pos'], goodDir: 'up',
                  def: 'Completed transactions, voids and refunds excluded · from ' + P.pos,
                  decision: 'Busier or quieter? Points you at footfall versus spend per visit.' },
  acs:          { label: 'Average customer spend', fmt: 'money2', needs: ['accounting', 'pos'], goodDir: 'up',
                  def: 'Revenue (' + P.accounting + ', ' + KIT_CONFIG.taxLabel + ') ÷ transactions (' + P.pos + ')',
                  decision: 'Are upsells and pricing working? Move it with specials, bundles and staff prompts.' },
  cogs:         { label: 'Cost of goods', fmt: 'money', dual: true, needs: ['accounting'], goodDir: 'down',
                  def: 'Everything in your Cost of Sales accounts, ' + KIT_CONFIG.taxLabel + ' · from ' + P.accounting,
                  decision: 'Rising as a share of revenue? Check supplier prices, portioning and waste.' },
  wage:         { label: 'Wage %', fmt: 'pct', dual: true, needs: ['accounting'], goodDir: 'down',
                  def: 'Wages plus super ÷ revenue · from ' + P.accounting,
                  decision: 'Rostered to your trade? Over target means trim hours or lift sales per shift.' },
  overheads:    { label: 'Overheads', fmt: 'money', dual: true, needs: ['accounting'], goodDir: 'down',
                  def: 'Operating expenses excluding wages, super and cost of sales · from ' + P.accounting,
                  decision: 'Fixed costs drifting up? Review subscriptions, utilities and new recurring spend.' },
  profit:       { label: 'Profit', fmt: 'money', dual: true, needs: ['accounting'], goodDir: 'up',
                  def: 'Revenue less cost of sales, wages, super and overheads · from ' + P.accounting,
                  decision: 'What the venue keeps after the costs you control. The bottom line of the board.' }
};
var CHOSEN = KIT_CONFIG.metrics.filter(function (k) { return METRIC_DEFS[k]; });

var SOURCES = [
  { key: 'accounting', name: P.accounting, role: 'Money figures (' + KIT_CONFIG.taxLabel + ')' },
  { key: 'pos',        name: P.pos,        role: 'Transaction count' }
];
if (P.rostering) SOURCES.push({ key: 'rostering', name: P.rostering, role: 'Projected wages (optional)' });

/* ============================================================
   Dates and periods - venue timezone, week start, rollover.
   All maths on UTC-noon stamps so daylight saving never bites.
============================================================ */
function partsInTz(dateObj, tz) {
  var fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false });
  var parts = {};
  fmt.formatToParts(dateObj).forEach(function (p) { parts[p.type] = p.value; });
  return { y: +parts.year, m: +parts.month, d: +parts.day, h: +(parts.hour === '24' ? 0 : parts.hour) };
}
function stamp(y, m, d) { return new Date(Date.UTC(y, m - 1, d, 12, 0, 0)); }
function addDays(s, n) { var x = new Date(s.getTime()); x.setUTCDate(x.getUTCDate() + n); return x; }
function addMonths(s, n) { var x = new Date(s.getTime()); x.setUTCMonth(x.getUTCMonth() + n); return x; }
function addYears(s, n) { var x = new Date(s.getTime()); x.setUTCFullYear(x.getUTCFullYear() + n); return x; }
function iso(s) { return s.toISOString().slice(0, 10); }
function fromIso(str) { var p = str.split('-'); return stamp(+p[0], +p[1], +p[2]); }
function monthKey(s) { return iso(s).slice(0, 7); }

/* Today as a TRADING day: before the rollover hour, it is still yesterday. */
function tradingToday() {
  var p = partsInTz(new Date(), SETTINGS.timezone);
  var t = stamp(p.y, p.m, p.d);
  if (p.h < (+SETTINGS.rolloverHour || 0)) t = addDays(t, -1);
  return t;
}
function startOfWeek(s) {
  var dow = s.getUTCDay();                       /* 0 Sun .. 6 Sat */
  var diff = (dow - SETTINGS.weekStart + 7) % 7;
  return addDays(s, -diff);
}
function fyStart(forDate) {
  var sm = KIT_CONFIG.fyStartMonth;
  var y = forDate.getUTCFullYear();
  var thisYears = stamp(y, sm, 1);
  return (forDate.getTime() >= thisYears.getTime()) ? thisYears : stamp(y - 1, sm, 1);
}

/* Period keys are "<type>:<offset>" (e.g. "week:0" = this week, "week:-1" =
   last week, "quarter:-2" = two quarters ago) or the literal "custom". offset
   0 is always the current, in-progress period; offset must never be positive
   (no future periods) - the UI clamps the "next" arrow at 0. */
var PERIOD_TYPES = [
  { type: 'week',    label: 'Week' },
  { type: 'month',   label: 'Month' },
  { type: 'quarter', label: 'Quarter' },
  { type: 'fy',      label: 'Financial year' },
  { type: 'custom',  label: 'Custom…' }
];
/* Pre-refresh saved settings/entries used flat keys like "thisWeek" - map them
   onto the new type:offset scheme so nothing already saved on Kane's browser breaks. */
var LEGACY_PERIOD_MAP = { thisWeek: 'week:0', lastWeek: 'week:-1', thisMonth: 'month:0', lastMonth: 'month:-1', thisFY: 'fy:0', lastFY: 'fy:-1' };
function normalizePeriodKey(key) { return LEGACY_PERIOD_MAP[key] || key || 'week:0'; }
function periodParts(key) {
  key = normalizePeriodKey(key);
  var i = key.indexOf(':');
  if (i < 0) return { type: key, offset: 0 };
  return { type: key.slice(0, i), offset: parseInt(key.slice(i + 1), 10) || 0 };
}
function periodKey(type, offset) { return type + ':' + offset; }
function quarterStart(forDate) {
  var q = Math.floor(forDate.getUTCMonth() / 3) * 3;   /* 0, 3, 6, 9 - calendar quarters */
  return stamp(forDate.getUTCFullYear(), q + 1, 1);
}

/* Returns { from, to, prev:{from,to}, yoy:{from,to}|null, prevLabel, yoyLabel } */
function resolvePeriod(key, customFrom, customTo) {
  var today = tradingToday();
  var from, to, prev, yoy, prevLabel, yoyLabel;
  var pp = periodParts(key);
  var type = pp.type, offset = pp.offset;

  if (type === 'week') {
    var ws = addDays(startOfWeek(today), offset * 7);
    from = ws; to = (offset === 0) ? today : addDays(ws, 6);
    prev = { from: addDays(from, -7), to: addDays(to, -7) };
    yoy = { from: addDays(from, -364), to: addDays(to, -364) };   /* weekday-aligned */
    prevLabel = 'vs week before'; yoyLabel = 'vs same week last year';
  } else if (type === 'month') {
    from = addMonths(stamp(today.getUTCFullYear(), today.getUTCMonth() + 1, 1), offset);
    var endOfMonth = addDays(addMonths(from, 1), -1);
    to = (offset === 0) ? today : endOfMonth;
    var pf = addMonths(from, -1);
    var pt = (offset === 0) ? addMonths(to, -1) : addDays(from, -1);
    if (offset === 0 && pt.getTime() < pf.getTime()) pt = pf;
    prev = { from: pf, to: pt };
    yoy = { from: addYears(from, -1), to: addYears(to, -1) };
    prevLabel = 'vs month before'; yoyLabel = 'vs same month last year';
  } else if (type === 'quarter') {
    from = addMonths(quarterStart(today), offset * 3);
    var endOfQuarter = addDays(addMonths(from, 3), -1);
    to = (offset === 0) ? today : endOfQuarter;
    var pqf = addMonths(from, -3);
    var pqt = (offset === 0) ? addMonths(to, -3) : addDays(from, -1);
    if (offset === 0 && pqt.getTime() < pqf.getTime()) pqt = pqf;
    prev = { from: pqf, to: pqt };
    yoy = { from: addYears(from, -1), to: addYears(to, -1) };
    prevLabel = 'vs quarter before'; yoyLabel = 'vs same quarter last year';
  } else if (type === 'fy') {
    from = addYears(fyStart(today), offset);
    to = (offset === 0) ? today : addDays(addYears(from, 1), -1);
    prev = { from: addYears(from, -1), to: addYears(to, -1) };
    yoy = null;
    prevLabel = (offset === 0) ? 'vs last financial year to the same date' : 'vs the financial year before'; yoyLabel = null;
  } else { /* custom */
    if (!customFrom || !customTo) return resolvePeriod('week:0');
    from = fromIso(customFrom); to = fromIso(customTo);
    if (to.getTime() < from.getTime()) { var sw = from; from = to; to = sw; }
    var len = Math.round((to.getTime() - from.getTime()) / 86400000) + 1;
    prev = { from: addDays(from, -len), to: addDays(from, -1) };
    yoy = { from: addYears(from, -1), to: addYears(to, -1) };
    prevLabel = 'vs the ' + len + ' days before'; yoyLabel = 'vs same dates last year';
  }
  return { from: from, to: to, prev: prev, yoy: yoy, prevLabel: prevLabel, yoyLabel: yoyLabel };
}

var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fyLabelFull(r) { return 'FY' + (r.from.getUTCFullYear() + (KIT_CONFIG.fyStartMonth > 1 ? 1 : 0)); }

/* Human label for a period key - defaults to the currently selected one. */
function periodLabel(key) {
  key = key || state.period;
  var pp = periodParts(key);
  if (pp.type === 'custom') return 'Custom range';
  var r = resolvePeriod(key, state.customFrom, state.customTo);
  if (pp.type === 'week') return pp.offset === 0 ? 'This week' : (pp.offset === -1 ? 'Last week' : fmtRange(r));
  if (pp.type === 'month') {
    if (pp.offset === 0) return 'This month';
    if (pp.offset === -1) return 'Last month';
    return MONTH_NAMES[r.from.getUTCMonth()] + ' ' + r.from.getUTCFullYear();
  }
  if (pp.type === 'quarter') {
    var q = Math.floor(r.from.getUTCMonth() / 3) + 1;
    var qLab = 'Q' + q + ' ' + r.from.getUTCFullYear();
    if (pp.offset === 0) return 'This quarter (' + qLab + ')';
    if (pp.offset === -1) return 'Last quarter (' + qLab + ')';
    return qLab;
  }
  if (pp.type === 'fy') {
    if (pp.offset === 0) return 'This financial year (' + fyLabelFull(r) + ')';
    if (pp.offset === -1) return 'Last financial year (' + fyLabelFull(r) + ')';
    return fyLabelFull(r);
  }
  return '';
}

function fmtRange(r) {
  function f(s) {
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return s.getUTCDate() + ' ' + months[s.getUTCMonth()] + ' ' + s.getUTCFullYear();
  }
  return f(r.from) + ' to ' + f(r.to);
}

/* ============================================================
   App state + data fetch
============================================================ */
var state = {
  view: 'dashboard',           /* dashboard | manager | connections | recon | settings */
  period: SETTINGS.defaultPeriod === 'custom' ? 'week:0' : normalizePeriodKey(SETTINGS.defaultPeriod),
  customFrom: null, customTo: null,
  loading: false,
  data: null,                  /* last /api/metrics payload */
  fetchedAt: null,
  fetchError: null,
  managerLoc: 'combined'       /* "Talking to" store picker on the Manager view - independent of SETTINGS.location */
};

/* Last N week-start dates (oldest first), ending at the current in-progress
   week - respects the venue's own weekStart, since the server can't guess it. */
var MGR_WEEKLY_TREND_COUNT = 8; /* matches the Manager view sparkline length exactly - no wasted API calls */
function lastNWeekStarts(n) {
  var cur = startOfWeek(tradingToday());
  var out = [];
  for (var i = n - 1; i >= 0; i--) out.push(iso(addDays(cur, -7 * i)));
  return out;
}

function apiUrl(force) {
  var r = resolvePeriod(state.period, state.customFrom, state.customTo);
  var trendEnd = tradingToday();
  var trendStart = addMonths(stamp(trendEnd.getUTCFullYear(), trendEnd.getUTCMonth() + 1, 1), -24);
  var q = 'cur=' + iso(r.from) + ':' + iso(r.to)
        + '&prev=' + iso(r.prev.from) + ':' + iso(r.prev.to)
        + (r.yoy ? '&yoy=' + iso(r.yoy.from) + ':' + iso(r.yoy.to) : '')
        + '&trend=' + monthKey(trendStart) + ':' + monthKey(trendEnd)
        + '&trendW=' + lastNWeekStarts(MGR_WEEKLY_TREND_COUNT).join(',')
        + '&tz=' + encodeURIComponent(SETTINGS.timezone)
        + '&rollover=' + (+SETTINGS.rolloverHour || 0);
  return '/api/metrics?' + q + (force ? '&refresh=1' : '');
}

/* ---------- Manual mode: build state.data from typed-in numbers ---------- */
function manualEntry(rng) { return rng ? MANUAL[rangeKey(rng.from, rng.to)] : null; }
function manualPeriod(entry) {
  if (!entry) return null;
  var v = entry.values || {};
  return {
    accounting: { revenue: num(v.revenue), cogs: num(v.cogs), wagesSuper: num(v.wagesSuper), overheads: num(v.overheads) },
    pos: { count: num(v.count) },
    rostering: { cost: num(v.rosteredCost) }
  };
}
function buildManualTrend() {

/* ============================================================
   Recipe costing / theoretical COGS
   ------------------------------------------------------------
   RECIPE_DATA.raw     : raw ingredient name -> { display, measure, qty,
                          unit, price, source, note }. `price` here is the
                          baked-in default (last known price at build time).
   RECIPE_DATA.recipes : recipe key -> { display, category, portions,
                          sellPrice, sellSource, inRollup, lines: [
                            { ingredient, qty, kind } ] }.
     kind 'raw'      - ingredient is a row in RECIPE_DATA.raw, cost is
                        price/qty (per its own base unit) times the line qty.
     kind 'raw-self' - a menu "add-on" item (bacon, cheese slice, pineapple,
                        pickles, halloumi, chicken bites) named identically
                        to its own raw ingredient. MUST resolve straight to
                        RECIPE_DATA.raw, never recurse into the recipe of the
                        same name - that recipe's own line already bakes in
                        the standard portion size, so recursing here would
                        multiply that portion size in twice (confirmed by
                        cross-checking against the spreadsheet's own stored
                        totals - this is what mismatched before the fix).
     kind 'sub-recipe' - a batch/prep item (aioli, BBQ sauce, another menu
                        item used inside a combo) - cost is resolved LIVE by
                        recursing into that recipe's own current lines,
                        rather than a stale copied-in price. This is the
                        "chain it properly" behaviour Kane asked for instead
                        of matching the spreadsheet's manual-copy staleness.
   Six "box" combos (mates plate x4, feed the fam x2) were removed from the
   menu (confirmed 2026-09) and are not in RECIPE_DATA at all - they were
   also the only recipes whose sheet math depended on those stale copies.

   Ingredient prices update weekly from the "gmail suppliers" project via
   POST /api/ingredient-prices (see worker.js) - fetched once per session
   and merged over the baked-in defaults above, so a price refresh needs no
   redeploy of this file. If the fetch hasn't completed yet, or a given
   ingredient has no override on file, its baked-in default price is used -
   the tab never blocks or blanks out waiting on this.

   RECIPE_DATA itself is now EDITABLE from the dashboard (resize a portion,
   drop an ingredient, add a whole new item) - RECIPE_DATA_DEFAULT above stays
   frozen as the baked-in fallback, while RECIPE_DATA is a live working copy
   that a save from the editor UI replaces wholesale and POSTs to
   /api/recipes. Until the first save, RECIPE_DATA just IS the default. */

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
var RECIPE_DATA = deepClone(RECIPE_DATA_DEFAULT);
var recipeDataState = { source: 'default', updatedAt: null, loaded: false };

function fetchRecipes() {
  fetch('/api/recipes').then(function (res) {
    return res.ok ? res.json() : null;
  }).then(function (payload) {
    if (payload && payload.data && payload.data.raw && payload.data.recipes) {
      RECIPE_DATA = payload.data;
      recipeDataState.source = 'server';
      recipeDataState.updatedAt = payload.updatedAt;
    }
    recipeDataState.loaded = true;
    if (state.view === 'costing') render();
  }).catch(function () { recipeDataState.loaded = true; });
}

/* Works out 'kind' for one ingredient line the same way the engine needs it:
   A name that exists as BOTH a raw ingredient AND a recipe (bacon, cheese
   slice, pineapple, pickles, halloumi, chicken bites - each sold as its own
   standalone add-on, wrapping a raw ingredient of the same name) ALWAYS
   resolves to the raw row, wherever it's referenced - including from within
   its own same-named recipe. This must hold everywhere that name is used as
   an ingredient line, not only inside its own recipe: that same-named
   recipe's own line already bakes in its standard portion size (e.g. bacon's
   recipe means "80g, the standard side serve"), so resolving some OTHER
   recipe's "bacon" line through the recipe instead of straight to the raw
   ingredient would multiply that 80g back in on top of whatever quantity the
   other recipe specifies - confirmed by cross-checking against the original
   spreadsheet's own totals; this is exactly what mismatched before that fix,
   and re-deriving 'kind' from only a same-key check (rather than this
   collision check) would silently reintroduce it on the next save. A plain
   recipe-as-ingredient with no raw-ingredient collision resolves as
   'sub-recipe' (chained live); a plain ingredient with no recipe of the same
   name resolves as 'raw'. Returns null when the name matches neither - the
   editor UI blocks saving until every line resolves. `recipeKey` is unused
   now (kept so callers don't need to change) - the raw/recipe name collision
   itself is what decides self-reference, not which recipe is asking. */
function inferLineKind(recipeKey, ingredientName) {
  var iname = String(ingredientName).trim().toLowerCase();
  var hasRaw = !!RECIPE_DATA.raw[iname];
  var hasRecipe = !!RECIPE_DATA.recipes[iname];
  if (hasRaw && hasRecipe) return 'raw-self';
  if (hasRecipe) return 'sub-recipe';
  if (hasRaw) return 'raw';
  return null;
}

/* Recomputes every line's kind (call after ANY edit, since renaming a recipe
   or adding/removing an ingredient can change what other lines resolve to)
   and returns a list of problems - display strings, or [] if the whole
   document is internally consistent and safe to save. */
function validateRecipeData() {
  var problems = [];
  Object.keys(RECIPE_DATA.recipes).forEach(function (key) {
    var rec = RECIPE_DATA.recipes[key];
    if (!rec.lines.length) problems.push('"' + rec.display + '" has no ingredients.');
    rec.lines.forEach(function (line) {
      var kind = inferLineKind(key, line.ingredient);
      if (!kind) {
        problems.push('"' + rec.display + '": ingredient "' + line.ingredient + '" doesn’t match any raw ingredient or recipe.');
      } else {
        line.kind = kind;
      }
      if (!(line.qty > 0)) problems.push('"' + rec.display + '": "' + line.ingredient + '" needs a quantity greater than 0.');
    });
  });
  return problems;
}

function saveRecipeData(onDone) {
  var problems = validateRecipeData();
  if (problems.length) { onDone(problems); return; }
  fetch('/api/recipes', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ raw: RECIPE_DATA.raw, recipes: RECIPE_DATA.recipes }),
  }).then(function (res) { return res.json().then(function (j) { return { ok: res.ok, body: j }; }); })
    .then(function (r) {
      if (!r.ok) { onDone([r.body && r.body.plain ? r.body.plain : 'Save failed.']); return; }
      recipeDataState.source = 'server';
      recipeDataState.updatedAt = r.body.updatedAt;
      onDone([]);
    })
    .catch(function () { onDone(['Save failed - check your connection and try again.']); });
}

/* ---- Editor mutation helpers ----
   Renaming an existing raw ingredient or recipe isn't supported yet - every
   OTHER recipe's ingredient lines reference it by name, and cascading a
   rename safely (including the six self-referencing add-ons, where the raw
   ingredient and the recipe share a name on purpose) is real complexity for
   a case Kane hasn't asked for. Delete and recreate covers a genuine rename
   for now; this can be added later if it turns out to matter. */
function whichRecipesUse(ingredientKey) {
  var users = [];
  Object.keys(RECIPE_DATA.recipes).forEach(function (key) {
    RECIPE_DATA.recipes[key].lines.forEach(function (line) {
      if (String(line.ingredient).trim().toLowerCase() === ingredientKey) users.push(RECIPE_DATA.recipes[key].display);
    });
  });
  return users;
}
function addRawIngredient(name) {
  var key = String(name).trim().toLowerCase();
  if (!key) return 'Give it a name.';
  if (RECIPE_DATA.raw[key]) return '"' + name + '" already exists.';
  RECIPE_DATA.raw[key] = { display: String(name).trim(), measure: 'unit', qty: 1, unit: 'per unit', price: 0, source: 'manual', note: 'Added from the dashboard editor.' };
  return null;
}
function deleteRawIngredient(key) {
  var users = whichRecipesUse(key);
  if (users.length) return 'Still used in: ' + users.join(', ') + '. Remove it from those first.';
  delete RECIPE_DATA.raw[key];
  return null;
}
function addRecipe(name) {
  var key = String(name).trim().toLowerCase();
  if (!key) return 'Give it a name.';
  if (RECIPE_DATA.recipes[key]) return '"' + name + '" already exists.';
  RECIPE_DATA.recipes[key] = { display: String(name).trim(), category: '', portions: 1, sellPrice: null, sellSource: 'menu', inRollup: true, lines: [] };
  return null;
}
function deleteRecipe(key) {
  var users = [];
  Object.keys(RECIPE_DATA.recipes).forEach(function (k) {
    if (k === key) return;
    RECIPE_DATA.recipes[k].lines.forEach(function (line) {
      if (String(line.ingredient).trim().toLowerCase() === key) users.push(RECIPE_DATA.recipes[k].display);
    });
  });
  if (users.length) return 'Still used inside: ' + users.join(', ') + '. Remove it from those first.';
  delete RECIPE_DATA.recipes[key];
  return null;
}

var costingState = {
  overridePrices: {},   /* ingredient name -> { price, note } fetched from /api/ingredient-prices */
  overridesUpdatedAt: null,
  overridesLoaded: false,
  editActive: false,        /* showing the recipe/ingredient editor instead of the report */
  editSnapshot: null,       /* deep copy of RECIPE_DATA taken on entering edit mode, for Discard */
  editProblems: [],         /* validation messages blocking Save, [] when clean */
  editSaving: false,
  editSavedAt: null,        /* set briefly after a successful save, for the confirmation banner */
  editNewItemName: '',      /* live value of the "add new menu item" name field */
  editNewIngName: '',       /* live value of the "add new raw ingredient" name field */
  salesLoaded: false,       /* whether the first /api/recipe-sales fetch has returned */
  salesData: null,          /* raw {from,to,days,byItem,connected} from /api/recipe-sales */
  salesPeriodDays: 84,      /* 12 weeks default - selector in the UI switches this */
  salesError: null,
};

/* Real Square sales, matched to recipes, for the "what actually sells" view
   below the theoretical report - see the big comment on squareItemSalesSync
   in worker.js for why this is a separate, approved capability. */
function fetchItemSales() {
  var url = '/api/recipe-sales?days=' + costingState.salesPeriodDays;
  fetch(url).then(function (res) {
    return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status));
  }).then(function (data) {
    costingState.salesData = data;
    costingState.salesError = null;
    costingState.salesLoaded = true;
    if (state.view === 'costing') render();
  }).catch(function (e) {
    costingState.salesError = 'Couldn’t load Square sales data.';
    costingState.salesLoaded = true;
    if (state.view === 'costing') render();
  });
}

/* Matches each Square line-item name (lowercased, trimmed) to a recipe key
   by exact match only for now - anything that doesn't match is surfaced in
   "unmatched" rather than silently dropped, since a naming mismatch (Square
   calling it "Classic Daddy Burger" vs the recipe key "classic daddy") would
   otherwise quietly understate real sales-mix coverage. */
function buildSalesMix(report) {
  var sd = costingState.salesData;
  if (!sd || !sd.byItem) return null;
  var itemsByKey = {};
  report.items.forEach(function (it) { itemsByKey[it.key] = it; });

  var matched = [];
  var unmatched = [];
  var totalQty = 0, totalRevenue = 0, totalFoodCost = 0;
  var matchedRevenue = 0;

  Object.keys(sd.byItem).forEach(function (sqKey) {
    var row = sd.byItem[sqKey];
    totalRevenue += row.gross;
    var it = itemsByKey[sqKey];
    if (!it) { unmatched.push({ name: row.name, qty: row.qty, revenue: row.gross }); return; }
    var foodCost = it.cost * row.qty;
    totalQty += row.qty;
    totalFoodCost += foodCost;
    matchedRevenue += row.gross;
    matched.push({
      key: it.key, display: it.display, qty: row.qty, revenue: row.gross,
      foodCost: foodCost, itemPct: row.gross > 0 ? (foodCost / row.gross * 100) : null,
    });
  });

  matched.forEach(function (m) { m.popularityPct = totalQty > 0 ? (m.qty / totalQty * 100) : 0; });
  matched.sort(function (a, b) { return b.revenue - a.revenue; });
  unmatched.sort(function (a, b) { return b.qty - a.qty; });

  return {
    days: sd.days, from: sd.from, to: sd.to, connected: sd.connected,
    matched: matched, unmatched: unmatched,
    totalQty: totalQty, totalRevenue: totalRevenue, matchedRevenue: matchedRevenue,
    totalFoodCost: totalFoodCost,
    actualCogsPct: matchedRevenue > 0 ? (totalFoodCost / matchedRevenue * 100) : null,
    matchedRevenueSharePct: totalRevenue > 0 ? (matchedRevenue / totalRevenue * 100) : null,
  };
}

function fetchIngredientPrices() {
  fetch('/api/ingredient-prices').then(function (res) {
    return res.ok ? res.json() : null;
  }).then(function (data) {
    if (data) {
      costingState.overridePrices = data.prices || {};
      costingState.overridesUpdatedAt = data.updatedAt || null;
    }
    costingState.overridesLoaded = true;
    if (state.view === 'costing') render();
  }).catch(function () { costingState.overridesLoaded = true; });
}

function rawPrice(name) {
  var key = String(name).trim().toLowerCase();
  var ov = costingState.overridePrices[key];
  var base = RECIPE_DATA.raw[key];
  if (!base) return { price: 0, qty: 1, unit: '', display: name, source: 'missing', note: 'No ingredient data for "' + name + '" at all - this recipe line can’t be costed.' };
  var price = (ov && typeof ov.price === 'number') ? ov.price : base.price;
  return {
    price: price, qty: base.qty, unit: base.unit, display: base.display,
    source: ov ? 'live-override' : base.source,
    note: ov && ov.note ? ov.note : base.note,
  };
}
function rawUnitCost(name) {
  var r = rawPrice(name);
  return (r.price != null && r.qty) ? (Number(r.price) / Number(r.qty)) : 0;
}

/* Cost of ONE unit of `key` (a recipe or a raw ingredient), per its own base
   unit - grams for a batch/portion item, "1" for a single-serve item.
   Recurses through sub-recipes; memoized per call to buildCostingReport()
   only (prices can change between renders, so nothing is cached across
   calls). Cycle-guarded, though the only structural cycle risk (the six
   raw-self add-ons) is already resolved via the 'raw-self' kind check below
   before recursion would ever happen. */
function makeCostingEngine() {
  var memo = {};
  var visiting = {};

  function lineUnitCost(line) {
    if (line.kind === 'raw-self') return rawUnitCost(line.ingredient);
    return unitCost(line.ingredient);
  }
  function unitCost(name) {
    var key = String(name).trim().toLowerCase();
    if (memo.hasOwnProperty(key)) return memo[key];
    if (visiting[key]) return 0; /* cycle guard - shouldn't hit given raw-self handling above */
    visiting[key] = true;
    var result;
    var rec = RECIPE_DATA.recipes[key];
    if (rec) {
      var total = 0;
      for (var i = 0; i < rec.lines.length; i++) {
        total += lineUnitCost(rec.lines[i]) * rec.lines[i].qty;
      }
      result = total / (rec.portions || 1);
    } else {
      result = rawUnitCost(key);
    }
    delete visiting[key];
    memo[key] = result;
    return result;
  }

  /* Flatten a recipe's cost down to raw ingredients, multiplier propagated
     through sub-recipe chains, for the "what's driving cost" breakdown. */
  function rawBreakdown(key, multiplier, into) {
    var rec = RECIPE_DATA.recipes[String(key).trim().toLowerCase()];
    if (!rec) {
      var rkey = String(key).trim().toLowerCase();
      into[rkey] = (into[rkey] || 0) + rawUnitCost(rkey) * multiplier;
      return;
    }
    var portions = rec.portions || 1;
    for (var i = 0; i < rec.lines.length; i++) {
      var line = rec.lines[i];
      var m = multiplier * line.qty / portions;
      if (line.kind === 'raw-self') {
        var rkey2 = String(line.ingredient).trim().toLowerCase();
        into[rkey2] = (into[rkey2] || 0) + rawUnitCost(rkey2) * m;
      } else if (line.kind === 'sub-recipe') {
        rawBreakdown(line.ingredient, m, into);
      } else {
        var rkey3 = String(line.ingredient).trim().toLowerCase();
        into[rkey3] = (into[rkey3] || 0) + rawUnitCost(rkey3) * m;
      }
    }
  }

  return { unitCost: unitCost, rawBreakdown: rawBreakdown };
}

/* Builds the full report fresh each time (cheap - 55 recipes, a few hundred
   lines total) so it always reflects the latest fetched prices. */
function buildCostingReport() {
  var engine = makeCostingEngine();
  var items = [];
  var rawCostTotals = {};

  Object.keys(RECIPE_DATA.recipes).forEach(function (key) {
    var rec = RECIPE_DATA.recipes[key];
    var total = 0;
    for (var i = 0; i < rec.lines.length; i++) {
      var line = rec.lines[i];
      var lc = (line.kind === 'raw-self') ? rawUnitCost(line.ingredient) : engine.unitCost(line.ingredient);
      total += lc * line.qty;
    }
    var portions = rec.portions || 1;
    var cost = total / portions;
    var sell = rec.sellPrice;
    var pct = (sell != null && sell > 0) ? (cost / sell * 100) : null;
    items.push({
      key: key, display: rec.display, category: rec.category,
      cost: cost, sell: sell, pct: pct,
      /* batchTotal/portions matter only for a non-rollup batch/prep item (a
         sauce etc.) - `cost` there is the per-unit-used cost fed into other
         recipes, which reads as meaningless on its own; batchTotal is the
         cost of making the whole batch, which is what Kane's own recipe
         sheet shows and can be sanity-checked against. */
      batchTotal: total, portions: portions,
      inRollup: rec.inRollup, sellSource: rec.sellSource,
      overTarget: pct != null && pct > 30,
    });
    if (rec.inRollup && sell) {
      engine.rawBreakdown(key, 1, rawCostTotals);
    }
  });

  var rollupItems = items.filter(function (it) { return it.inRollup && it.pct != null; });
  var overallPct = rollupItems.length
    ? rollupItems.reduce(function (s, it) { return s + it.pct; }, 0) / rollupItems.length
    : null;

  var topIngredients = Object.keys(rawCostTotals).map(function (k) {
    var r = rawPrice(k);
    return { name: r.display || k, cost: rawCostTotals[k] };
  }).sort(function (a, b) { return b.cost - a.cost; }).slice(0, 12);

  items.sort(function (a, b) { return (b.pct || -1) - (a.pct || -1); });

  return {
    items: items,
    overallPct: overallPct,
    itemCount: rollupItems.length,
    overTargetCount: rollupItems.filter(function (it) { return it.overTarget; }).length,
    topIngredients: topIngredients,
  };
}

/* ============================================================
   Rendering
============================================================ */
function app() { return document.getElementById('app'); }
function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function applyAccent() {
  var a = ACCENTS.filter(function (x) { return x.key === SETTINGS.accent; })[0] || ACCENTS[0];
  document.documentElement.style.setProperty('--accent', a.c);
  document.documentElement.style.setProperty('--accent-dim', a.dim);
}

function unconfirmedConnectedMetrics() {
  return CHOSEN.filter(function (k) {
    var ready = METRIC_DEFS[k].needs.every(isConfigured);
    return ready && RECON[k] !== 'confirmed';
  });
}
function anyFlagged() {
  return CHOSEN.some(function (k) { return RECON[k] === 'flagged'; });
}
function anyConfiguredSource() { return SOURCES.some(function (s) { return isConfigured(s.key); }); }
function unconfirmedOrgs() {
  return SOURCES.filter(function (s) {
    var st = srcStatus(s.key);
    return st.configured && st.connected && !ORG_OK[s.key];
  });
}

  applyAccent();

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- Dashboard view ---------- */
function renderDashboard(root) {
  var r = resolvePeriod(state.period, state.customFrom, state.customTo);
  var pp = periodParts(state.period);

  /* Period + Shop selector on one row: pick a period type, then step through
     it week-to-week (or month/quarter/year-to-year) with the arrows - no date
     typing needed unless you want a custom range. Shop sits on the right of
     the same row so both controls read together instead of stacking. */
  var controlBar = el('div', 'control-bar');
  var left = el('div', 'control-left');
  left.appendChild(el('span', 'period-label', 'Period'));
  PERIOD_TYPES.forEach(function (pt) {
    var c = el('button', 'pchip' + (pp.type === pt.type ? ' on' : ''), pt.label);
    c.onclick = function () {
      if (pt.type === 'custom') { state.period = 'custom'; render(); return; }
      state.period = periodKey(pt.type, 0); fetchData();
    };
    left.appendChild(c);
  });

  if (pp.type !== 'custom') {
    var nav = el('div', 'period-nav');
    nav.style.margin = '0';
    var prevBtn = el('button', 'nav-arrow', '‹');
    prevBtn.title = 'Previous ' + pp.type;
    prevBtn.onclick = function () { state.period = periodKey(pp.type, pp.offset - 1); fetchData(); };
    nav.appendChild(prevBtn);
    if (pp.offset !== 0) {
      var todayBtn = el('button', 'nav-today', 'Jump to current');
      todayBtn.onclick = function () { state.period = periodKey(pp.type, 0); fetchData(); };
      nav.appendChild(todayBtn);
    } else {
      nav.appendChild(el('span', 'nav-current', 'Current ' + pp.type));
    }
    var nextBtn = el('button', 'nav-arrow', '›');

    nextBtn.onclick = function () { if (pp.offset < 0) { state.period = periodKey(pp.type, pp.offset + 1); fetchData(); } };
    nav.appendChild(nextBtn);
    left.appendChild(nav);
  }
  controlBar.appendChild(left);

  /* Shop selector — flip the whole board to one shop or the combined total. */
  var right = el('div', 'control-right');
  right.appendChild(el('span', 'period-label', 'Shop'));
  [['combined', 'Combined'], ['windsor', 'Windsor'], ['richmond', 'Richmond']].forEach(function (o) {
    var c = el('button', 'pchip' + (curLoc() === o[0] ? ' on' : ''), o[1]);
    c.onclick = function () { SETTINGS.location = o[0]; saveSettings(); render(); };
    right.appendChild(c);

  if (pp.type === 'custom') {
    var cw = el('div', 'custom-wrap');
    var f = document.createElement('input'); f.type = 'date'; f.id = 'cfrom'; if (state.customFrom) f.value = state.customFrom;
    var t = document.createElement('input'); t.type = 'date'; t.id = 'cto'; if (state.customTo) t.value = state.customTo;
    var go = el('button', 'btn-small', 'Show this range');
    go.onclick = function () {
      var fv = document.getElementById('cfrom').value, tv = document.getElementById('cto').value;
      if (!fv || !tv) return;
      state.customFrom = fv; state.customTo = tv; fetchData();
    };
    cw.appendChild(el('span', 'cmp-lab', 'From'));
    cw.appendChild(f);
    cw.appendChild(el('span', 'cmp-lab', 'to'));
    cw.appendChild(t);
    cw.appendChild(go);
    root.appendChild(cw);
    if (!state.customFrom || !state.customTo) { root.appendChild(el('p', 'screen-sub', 'Pick a start and end date.')); return; }
  }

  /* Freshness (or, in manual mode, an edit prompt) */
  var fr = el('div', 'fresh-row');
  if (isManual()) {
    fr.innerHTML = 'Showing the numbers you entered.';
    var eb = el('button', 'btn-plain', 'Add or edit numbers');
    eb.style.padding = '5px 12px'; eb.style.fontSize = '12px';
    eb.onclick = function () { state.view = 'enter'; render(); };
    fr.appendChild(eb);
  } else if (state.loading) {
    fr.innerHTML = '<span class="spin"></span> Fetching your latest numbers…';
  } else {
    var when = state.fetchedAt ? state.fetchedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    fr.innerHTML = 'Updated ' + when + ' · updates when you open or refresh this page';
    var rb = el('button', 'btn-plain', 'Refresh');
    rb.style.padding = '5px 12px'; rb.style.fontSize = '12px';
    rb.onclick = function () { fetchData(true); };
    fr.appendChild(rb);
  }
  root.appendChild(fr);

  root.appendChild(el('div', 'period-heading', periodLabel() + ' <span>· ' + fmtRange(r) + '</span>'));

  /* Stale-data nudge: on a recent week you haven't confirmed yet, say so
     plainly rather than silently showing Xero's live (possibly bank-feed-
     lagged) figure as if it were final. Only for the current week and the
     one or two before it - older weeks are just history, not "stale". */
  if (!isManual() && pp.type === 'week' && pp.offset <= 0 && pp.offset >= -2) {
    var wkKey = rangeKey(r.from, r.to);
    if (!OVERRIDES[wkKey]) {
      var nudge = el('div', 'banner banner-amber');
